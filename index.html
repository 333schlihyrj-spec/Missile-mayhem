<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Missile Mayhem</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
}

body {
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}

/* HUD */

#hud {
    position: fixed;
    top: 15px;
    left: 15px;
    right: 15px;

    display: flex;
    justify-content: space-between;

    color: white;
    font-weight: bold;
    font-size: 20px;

    text-shadow: 2px 2px 4px #000;

    pointer-events: none;
    z-index: 5;
}

/* Pause */

#pauseBtn {
    position: fixed;

    top: 55px;
    right: 15px;

    z-index: 6;

    padding: 10px 16px;
    margin: 0;

    font-size: 16px;
}

/* Menus */

#menu,
#customMenu {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.65);

    z-index: 10;
}

.panel {
    width: min(90vw, 500px);

    padding: 30px;

    border-radius: 20px;

    background: rgba(20,25,35,.95);

    color: white;

    text-align: center;

    box-shadow: 0 0 40px rgba(0,0,0,.7);
}

h1 {
    font-size: 48px;
    margin-bottom: 10px;
}

button {
    border: none;

    border-radius: 12px;

    padding: 14px 22px;
    margin: 7px;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;

    background: #3498db;
    color: white;
}

button:hover {
    background: #5dade2;
}

.option {
    margin: 12px 0;
}

.option label {
    display: block;
    margin-bottom: 5px;
}

select {
    padding: 8px;

    border-radius: 8px;

    font-size: 16px;
}

/* Mobile */

#mobileControls {
    position: fixed;

    bottom: 20px;

    left: 0;
    right: 0;

    display: flex;

    justify-content: space-around;

    pointer-events: none;

    z-index: 5;
}

.mobileButton {
    width: 130px;
    height: 65px;

    border-radius: 20px;

    background: rgba(255,255,255,.2);

    border: 2px solid rgba(255,255,255,.5);

    color: white;

    font-weight: bold;

    font-size: 20px;

    pointer-events: auto;

    touch-action: none;
}

.hidden {
    display: none !important;
}

.small {
    font-size: 14px;

    opacity: .75;

    margin-top: 10px;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- HUD -->

<div id="hud">

    <div id="score">
        SCORE: 0
    </div>

    <div id="level">
        LEVEL: 1
    </div>

    <div id="lives">
        LIVES: ❤️❤️❤️
    </div>

</div>

<button id="pauseBtn" onclick="togglePause()">
    PAUSE
</button>

<!-- START MENU -->

<div id="menu">

    <div class="panel">

        <h1>
            MISSILE MAYHEM
        </h1>

        <p>
            Dodge the incoming missiles!
        </p>

        <br>

        <button onclick="openCustomization()">
            CUSTOMIZE
        </button>

        <button onclick="startGame()">
            START GAME
        </button>

        <div class="small">

            SPACE / UP = Jump<br>
            DOWN = Duck<br>
            P = Pause

        </div>

    </div>

</div>

<!-- CUSTOMIZATION -->

<div id="customMenu" class="hidden">

    <div class="panel">

        <h2>
            Customize Character
        </h2>

        <div class="option">

            <label>
                Skin
            </label>

            <select id="skin">

                <option value="#f1c27d">
                    Light
                </option>

                <option value="#c68642">
                    Tan
                </option>

                <option value="#8d5524">
                    Brown
                </option>

                <option value="#5c3a21">
                    Dark
                </option>

            </select>

        </div>

        <div class="option">

            <label>
                Shirt
            </label>

            <select id="shirt">

                <option value="#3498db">
                    Blue
                </option>

                <option value="#e74c3c">
                    Red
                </option>

                <option value="#2ecc71">
                    Green
                </option>

                <option value="#f1c40f">
                    Yellow
                </option>

                <option value="#9b59b6">
                    Purple
                </option>

            </select>

        </div>

        <div class="option">

            <label>
                Pants
            </label>

            <select id="pants">

                <option value="#222222">
                    Black
                </option>

                <option value="#34495e">
                    Dark Blue
                </option>

                <option value="#795548">
                    Brown
                </option>

                <option value="#7f8c8d">
                    Gray
                </option>

            </select>

        </div>

        <div class="option">

            <label>
                Hair
            </label>

            <select id="hair">

                <option value="#111111">
                    Black
                </option>

                <option value="#5b3219">
                    Brown
                </option>

                <option value="#d4a017">
                    Blond
                </option>

                <option value="#888888">
                    Gray
                </option>

            </select>

        </div>

        <div class="option">

            <label>
                Accessory
            </label>

            <select id="accessory">

                <option value="none">
                    None
                </option>

                <option value="cap">
                    Cap
                </option>

                <option value="glasses">
                    Glasses
                </option>

            </select>

        </div>

        <button onclick="closeCustomization()">
            DONE
        </button>

    </div>

</div>

<!-- MOBILE CONTROLS -->

<div id="mobileControls">

    <button
        class="mobileButton"
        id="jumpBtn">

        JUMP

    </button>

    <button
        class="mobileButton"
        id="duckBtn">

        DUCK

    </button>

</div>

<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

let width;
let height;

function resize() {

    width =
        canvas.width =
        window.innerWidth *
        devicePixelRatio;

    height =
        canvas.height =
        window.innerHeight *
        devicePixelRatio;

    canvas.style.width =
        window.innerWidth + "px";

    canvas.style.height =
        window.innerHeight + "px";

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );

    width =
        window.innerWidth;

    height =
        window.innerHeight;
}

window.addEventListener(
    "resize",
    resize
);

resize();

/* =====================================================
   SOUND SYSTEM
===================================================== */

let audioContext = null;

function initAudio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();

    }

}

function sound(type) {

    if (!audioContext) return;

    const now =
        audioContext.currentTime;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );

    /* JUMP */

    if (type === "jump") {

        oscillator.type =
            "square";

        oscillator.frequency.setValueAtTime(
            280,
            now
        );

        oscillator.frequency
            .exponentialRampToValueAtTime(
                620,
                now + 0.12
            );

        gain.gain.setValueAtTime(
            0.12,
            now
        );

        gain.gain
            .exponentialRampToValueAtTime(
                0.001,
                now + 0.15
            );

        oscillator.start(now);

        oscillator.stop(
            now + 0.15
        );
    }

    /* HIT */

    if (type === "hit") {

        oscillator.type =
            "sawtooth";

        oscillator.frequency
            .setValueAtTime(
                130,
                now
            );

        oscillator.frequency
            .exponentialRampToValueAtTime(
                45,
                now + 0.35
            );

        gain.gain.setValueAtTime(
            0.2,
            now
        );

        gain.gain
            .exponentialRampToValueAtTime(
                0.001,
                now + 0.35
            );

        oscillator.start(now);

        oscillator.stop(
            now + 0.35
        );
    }

    /* SCORE */

    if (type === "score") {

        oscillator.type =
            "sine";

        oscillator.frequency
            .setValueAtTime(
                650,
                now
            );

        oscillator.frequency
            .setValueAtTime(
                900,
                now + 0.08
            );

        gain.gain.setValueAtTime(
            0.08,
            now
        );

        gain.gain
            .exponentialRampToValueAtTime(
                0.001,
                now + 0.16
            );

        oscillator.start(now);

        oscillator.stop(
            now + 0.16
        );
    }

    /* GAME OVER */

    if (type === "gameover") {

        oscillator.type =
            "sawtooth";

        oscillator.frequency
            .setValueAtTime(
                300,
                now
            );

        oscillator.frequency
            .exponentialRampToValueAtTime(
                70,
                now + 0.6
            );

        gain.gain.setValueAtTime(
            0.16,
            now
        );

        gain.gain
            .exponentialRampToValueAtTime(
                0.001,
                now + 0.6
            );

        oscillator.start(now);

        oscillator.stop(
            now + 0.6
        );
    }

    /* START */

    if (type === "start") {

        oscillator.type =
            "square";

        oscillator.frequency
            .setValueAtTime(
                350,
                now
            );

        oscillator.frequency
            .setValueAtTime(
                500,
                now + 0.08
            );

        oscillator.frequency
            .setValueAtTime(
                700,
                now + 0.16
            );

        gain.gain.setValueAtTime(
            0.1,
            now
        );

        gain.gain
            .exponentialRampToValueAtTime(
                0.001,
                now + 0.25
            );

        oscillator.start(now);

        oscillator.stop(
            now + 0.25
        );
    }

    /* MISSILE WHOOSH */

    if (type === "whoosh") {

        oscillator.type =
            "triangle";

        oscillator.frequency
            .setValueAtTime(
                180,
                now
            );

        oscillator.frequency
            .exponentialRampToValueAtTime(
                70,
                now + 0.25
            );

        gain.gain.setValueAtTime(
            0.035,
            now
        );

        gain.gain
            .exponentialRampToValueAtTime(
                0.001,
                now + 0.25
            );

        oscillator.start(now);

        oscillator.stop(
            now + 0.25
        );
    }
}

/* =====================================================
   GAME VARIABLES
===================================================== */

let running = false;

let paused = false;

let score = 0;

let level = 1;

let lives = 3;

let missiles = [];

let particles = [];

let spawnTimer = 0;

let lastTime = 0;

let screenShake = 0;

let redFlash = 0;

/* =====================================================
   PLAYER
===================================================== */

const player = {

    x: 100,

    y: 0,

    w: 34,

    h: 54,

    velocity: 0,

    jumpPower: 760,

    gravity: 1900,

    jumping: false,

    ducking: false,

    invincible: 0

};

/* =====================================================
   CUSTOMIZATION
===================================================== */

const customization = {

    skin: "#f1c27d",

    shirt: "#3498db",

    pants: "#222222",

    hair: "#111111",

    accessory: "none"

};

/* =====================================================
   MENU
===================================================== */

function openCustomization() {

    document
        .getElementById("customMenu")
        .classList
        .remove("hidden");

}

function closeCustomization() {

    customization.skin =
        document.getElementById(
            "skin"
        ).value;

    customization.shirt =
        document.getElementById(
            "shirt"
        ).value;

    customization.pants =
        document.getElementById(
            "pants"
        ).value;

    customization.hair =
        document.getElementById(
            "hair"
        ).value;

    customization.accessory =
        document.getElementById(
            "accessory"
        ).value;

    localStorage.setItem(
        "missileCustomization",
        JSON.stringify(
            customization
        )
    );

    document
        .getElementById("customMenu")
        .classList
        .add("hidden");
}

function loadCustomization() {

    const saved =
        localStorage.getItem(
            "missileCustomization"
        );

    if (!saved) return;

    try {

        Object.assign(
            customization,
            JSON.parse(saved)
        );

        document.getElementById(
            "skin"
        ).value =
            customization.skin;

        document.getElementById(
            "shirt"
        ).value =
            customization.shirt;

        document.getElementById(
            "pants"
        ).value =
            customization.pants;

        document.getElementById(
            "hair"
        ).value =
            customization.hair;

        document.getElementById(
            "accessory"
        ).value =
            customization.accessory;

    } catch {}

}

loadCustomization();

/* =====================================================
   START GAME
===================================================== */

function startGame() {

    initAudio();

    sound("start");

    score = 0;

    level = 1;

    lives = 3;

    missiles = [];

    particles = [];

    paused = false;

    running = true;

    player.jumping = false;

    player.ducking = false;

    player.velocity = 0;

    player.invincible = 0;

    document
        .getElementById("pauseBtn")
        .textContent =
        "PAUSE";

    document
        .getElementById("menu")
        .classList
        .add("hidden");

    updateHUD();

}

/* =====================================================
   GAME OVER
===================================================== */

function gameOver() {

    running = false;

    paused = false;

    sound("gameover");

    document
        .getElementById("pauseBtn")
        .textContent =
        "PAUSE";

    document
        .getElementById("menu")
        .classList
        .remove("hidden");

}

/* =====================================================
   PAUSE
===================================================== */

function togglePause() {

    if (!running) return;

    paused =
        !paused;

    const button =
        document.getElementById(
            "pauseBtn"
        );

    if (paused) {

        button.textContent =
            "RESUME";

    } else {

        button.textContent =
            "PAUSE";

        /*
         Prevent the game from
         jumping forward after pause.
        */

        lastTime =
            performance.now();

    }

}

/* Keyboard pause */

window.addEventListener(
    "keydown",
    e => {

        if (
            e.code === "KeyP"
        ) {

            togglePause();

        }

    }
);

/* =====================================================
   CONTROLS
===================================================== */

function jump() {

    if (!running || paused)
        return;

    if (!player.jumping) {

        player.ducking =
            false;

        player.jumping =
            true;

        player.velocity =
            -player.jumpPower;

        sound("jump");

    }

}

function setDuck(value) {

    if (!running || paused)
        return;

    if (!player.jumping) {

        player.ducking =
            value;

    }

}

/* Keyboard */

window.addEventListener(
    "keydown",
    e => {

        if (
            e.code === "Space" ||
            e.code === "ArrowUp" ||
            e.code === "KeyW"
        ) {

            e.preventDefault();

            jump();

        }

        if (
            e.code === "ArrowDown" ||
            e.code === "KeyS"
        ) {

            e.preventDefault();

            setDuck(true);

        }

    }
);

window.addEventListener(
    "keyup",
    e => {

        if (
            e.code === "ArrowDown" ||
            e.code === "KeyS"
        ) {

            setDuck(false);

        }

    }
);

/* Mobile jump */

document
    .getElementById("jumpBtn")
    .addEventListener(
        "pointerdown",
        e => {

            e.preventDefault();

            jump();

        }
    );

/* Mobile duck */

const duckButton =
    document.getElementById(
        "duckBtn"
    );

duckButton.addEventListener(
    "pointerdown",
    e => {

        e.preventDefault();

        setDuck(true);

    }
);

duckButton.addEventListener(
    "pointerup",
    () => {

        setDuck(false);

    }
);

duckButton.addEventListener(
    "pointercancel",
    () => {

        setDuck(false);

    }
);

duckButton.addEventListener(
    "pointerleave",
    () => {

        setDuck(false);

    }
);

/* =====================================================
   MISSILES
===================================================== */

function spawnMissile() {

    /*
       Level 10+ can spawn giant missiles.
    */

    const giant =
        level >= 10 &&
        Math.random() < 0.15;

    const ground =
        height -
        Math.max(
            100,
            height * 0.16
        );

    const missile = {

        x: width + 80,

        y: 0,

        w: giant ? 150 : 70,

        h: giant ? 70 : 28,

        speed:
            430 +
            level * 35,

        giant,

        smokeTimer: 0,

        scored: false

    };

    if (giant) {

        missile.y =
            ground - 120;

    } else {

        missile.y =
            Math.random() < 0.5
                ? ground - 44
                : ground - 72;

    }

    missiles.push(
        missile
    );

    sound("whoosh");

}

/* =====================================================
   COLLISION
===================================================== */

function checkCollision(m) {

    let ph =
        player.h;

    if (
        player.ducking
    ) {

        ph = 32;

    }

    const px =
        player.x + 7;

    const py =
        player.y +
        (player.h - ph);

    const pw =
        player.w - 14;

    const mx =
        m.x + 5;

    const my =
        m.y + 4;

    const mw =
        m.w - 10;

    const mh =
        m.h - 8;

    /*
       Jumping completely over
       the missile is safe.
    */

    if (
        py + ph <= my
    ) {

        return false;

    }

    return (

        px <
        mx + mw &&

        px + pw >
        mx &&

        py <
        my + mh &&

        py + ph >
        my

    );

}

/* =====================================================
   HIT
===================================================== */

function hitPlayer() {

    if (
        player.invincible > 0
    ) {

        return;

    }

    lives--;

    sound("hit");

    player.invincible =
        1.2;

    screenShake =
        0.4;

    redFlash =
        0.22;

    for (
        let i = 0;
        i < 45;
        i++
    ) {

        particles.push({

            x:
                player.x +
                player.w / 2,

            y:
                player.y +
                player.h / 2,

            vx:
                (Math.random() - .5) *
                500,

            vy:
                (Math.random() - .5) *
                500,

            life:
                .5 +
                Math.random() * .5,

            size:
                3 +
                Math.random() * 5

        });

    }

    updateHUD();

    if (
        lives <= 0
    ) {

        setTimeout(
            gameOver,
            300
        );

    }

}

/* =====================================================
   UPDATE
===================================================== */

function update(dt) {

    /*
       Pause freezes EVERYTHING.
    */

    if (
        !running ||
        paused
    ) {

        return;

    }

    const ground =
        height -
        Math.max(
            100,
            height * 0.16
        );

    /* PLAYER */

    if (
        player.jumping
    ) {

        player.velocity +=
            player.gravity *
            dt;

        player.y +=
            player.velocity *
            dt;

        if (
            player.y >=
            ground -
            player.h
        ) {

            player.y =
                ground -
                player.h;

            player.velocity =
                0;

            player.jumping =
                false;

        }

    } else {

        player.y =
            ground -
            player.h;

    }

    if (
        player.invincible > 0
    ) {

        player.invincible -=
            dt;

    }

    /* MISSILE SPAWNING */

    spawnTimer -=
        dt;

    const spawnRate =
        Math.max(
            0.48,
            1.15 -
            level * 0.045
        );

    if (
        spawnTimer <= 0
    ) {

        spawnMissile();

        spawnTimer =
            spawnRate *
            (
                .75 +
                Math.random() *
                .45
            );

    }

    /* MISSILES */

    for (
        let i =
            missiles.length - 1;
        i >= 0;
        i--
    ) {

        const m =
            missiles[i];

        m.x -=
            m.speed *
            dt;

        /*
           SCORE
        */

        if (
            !m.scored &&
            m.x + m.w <
            player.x
        ) {

            m.scored =
                true;

            score++;

            sound("score");

            /*
               Every 10 points:
               10 = Level 2
               20 = Level 3
               30 = Level 4
               etc.
            */

            level =
                Math.floor(
                    score / 10
                ) + 1;

            updateHUD();

        }

        /* COLLISION */

        if (
            checkCollision(m)
        ) {

            hitPlayer();

            missiles.splice(
                i,
                1
            );

            continue;

        }

        /* REMOVE */

        if (
            m.x + m.w <
            -100
        ) {

            missiles.splice(
                i,
                1
            );

        }

    }

    /* PARTICLES */

    for (
        let i =
            particles.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            particles[i];

        p.x +=
            p.vx * dt;

        p.y +=
            p.vy * dt;

        p.vy +=
            700 * dt;

        p.life -=
            dt;

        if (
            p.life <= 0
        ) {

            particles.splice(
                i,
                1
            );

        }

    }

    screenShake =
        Math.max(
            0,
            screenShake - dt
        );

    redFlash =
        Math.max(
            0,
            redFlash - dt
        );

}

/* =====================================================
   BACKGROUND
===================================================== */

function drawBackground() {

    const ground =
        height -
        Math.max(
            100,
            height * 0.16
        );

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            height
        );

    gradient.addColorStop(
        0,
        "#152b52"
    );

    gradient.addColorStop(
        .65,
        "#426b91"
    );

    gradient.addColorStop(
        1,
        "#9eb8c9"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        width,
        height
    );

    /* Moon */

    ctx.fillStyle =
        "#f5f1c8";

    ctx.beginPath();

    ctx.arc(
        width * .8,
        height * .18,
        45,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /* Clouds */

    ctx.fillStyle =
        "rgba(255,255,255,.18)";

    for (
        let i = 0;
        i < 5;
        i++
    ) {

        const x =
            (
                i * 240 +
                100
            ) %
            (width + 300) -
            150;

        const y =
            80 +
            (i % 3) * 70;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            30,
            0,
            Math.PI * 2
        );

        ctx.arc(
            x + 35,
            y - 10,
            38,
            0,
            Math.PI * 2
        );

        ctx.arc(
            x + 75,
            y,
            28,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }

    /* Hills */

    ctx.fillStyle =
        "#294f42";

    ctx.beginPath();

    ctx.moveTo(
        0,
        ground
    );

    for (
        let x = 0;
        x <= width;
        x += 80
    ) {

        const y =
            ground -
            40 -
            Math.sin(
                x * .008
            ) * 35;

        ctx.lineTo(
            x,
            y
        );

    }

    ctx.lineTo(
        width,
        ground
    );

    ctx.closePath();

    ctx.fill();

    /* Ground */

    ctx.fillStyle =
        "#202820";

    ctx.fillRect(
        0,
        ground,
        width,
        height - ground
    );

    ctx.fillStyle =
        "#4c6047";

    ctx.fillRect(
        0,
        ground,
        width,
        6
    );

}

/* =====================================================
   PLAYER DRAW
===================================================== */

function drawPlayer() {

    if (
        player.invincible > 0 &&
        Math.floor(
            player.invincible * 12
        ) % 2 === 0
    ) {

        return;

    }

    let h =
        player.h;

    if (
        player.ducking
    ) {

        h = 32;

    }

    const x =
        player.x;

    const y =
        player.y +
        player.h -
        h;

    /* Legs */

    ctx.fillStyle =
        customization.pants;

    if (
        !player.ducking
    ) {

        ctx.fillRect(
            x + 7,
            y + 35,
            8,
            19
        );

        ctx.fillRect(
            x + 20,
            y + 35,
            8,
            19
        );

    } else {

        ctx.fillRect(
            x + 5,
            y + 23,
            23,
            9
        );

    }

    /* Body */

    ctx.fillStyle =
        customization.shirt;

    ctx.fillRect(
        x + 5,
        y + 16,
        24,
        player.ducking
            ? 15
            : 23
    );

    /* Head */

    ctx.fillStyle =
        customization.skin;

    ctx.beginPath();

    ctx.arc(
        x + 17,
        y + 10,
        10,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /* Hair */

    ctx.fillStyle =
        customization.hair;

    ctx.beginPath();

    ctx.arc(
        x + 17,
        y + 6,
        10,
        Math.PI,
        Math.PI * 2
    );

    ctx.fill();

    /* Arms */

    ctx.strokeStyle =
        customization.skin;

    ctx.lineWidth = 6;

    ctx.lineCap =
        "round";

    if (
        !player.ducking
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x + 6,
            y + 20
        );

        ctx.lineTo(
            x - 2,
            y + 32
        );

        ctx.stroke();

        ctx.beginPath();

        ctx.moveTo(
            x + 28,
            y + 20
        );

        ctx.lineTo(
            x + 36,
            y + 32
        );

        ctx.stroke();

    }

    /* Cap */

    if (
        customization.accessory ===
        "cap"
    ) {

        ctx.fillStyle =
            "#e74c3c";

        ctx.fillRect(
            x + 7,
            y - 2,
            20,
            5
        );

        ctx.fillRect(
            x + 25,
            y + 1,
            8,
            3
        );

    }

    /* Glasses */

    if (
        customization.accessory ===
        "glasses"
    ) {

        ctx.strokeStyle =
            "#111";

        ctx.lineWidth =
            2;

        ctx.strokeRect(
            x + 9,
            y + 7,
            6,
            5
        );

        ctx.strokeRect(
            x + 19,
            y + 7,
            6,
            5
        );

        ctx.beginPath();

        ctx.moveTo(
            x + 15,
            y + 9
        );

        ctx.lineTo(
            x + 19,
            y + 9
        );

        ctx.stroke();

    }

}

/* =====================================================
   MISSILE DRAW
===================================================== */

function drawMissile(m) {

    /*
       Flip entire missile so
       nose faces LEFT toward
       the player.
    */

    ctx.save();

    ctx.translate(
        m.x +
        m.w / 2,
        0
    );

    ctx.scale(
        -1,
        1
    );

    ctx.translate(
        -(m.x +
        m.w / 2),
        0
    );

    if (
        m.giant
    ) {

        drawGiantMissile(m);

    } else {

        drawNormalMissile(m);

    }

    ctx.restore();

}

/* =====================================================
   NORMAL MISSILE
===================================================== */

function drawNormalMissile(m) {

    const x =
        m.x;

    const y =
        m.y;

    const w =
        m.w;

    const h =
        m.h;

    /* Exhaust */

    const flame =
        ctx.createLinearGradient(
            x - 30,
            y,
            x,
            y
        );

    flame.addColorStop(
        0,
        "rgba(255,80,0,0)"
    );

    flame.addColorStop(
        .4,
        "#ff5a00"
    );

    flame.addColorStop(
        1,
        "#ffe66d"
    );

    ctx.fillStyle =
        flame;

    ctx.beginPath();

    ctx.moveTo(
        x - 35,
        y + h / 2
    );

    ctx.lineTo(
        x + 2,
        y + 5
    );

    ctx.lineTo(
        x + 2,
        y + h - 5
    );

    ctx.closePath();

    ctx.fill();

    /* Nozzle */

    ctx.fillStyle =
        "#20252a";

    ctx.fillRect(
        x - 5,
        y + 7,
        12,
        h - 14
    );

    /* Body */

    const body =
        ctx.createLinearGradient(
            x,
            y,
            x,
            y + h
        );

    body.addColorStop(
        0,
        "#dce3e7"
    );

    body.addColorStop(
        .3,
        "#7c8991"
    );

    body.addColorStop(
        .6,
        "#4d5960"
    );

    body.addColorStop(
        1,
        "#20282d"
    );

    ctx.fillStyle =
        body;

    ctx.beginPath();

    ctx.roundRect(
        x,
        y + 3,
        w - 12,
        h - 6,
        8
    );

    ctx.fill();

    /* Nose */

    ctx.fillStyle =
        "#9fa8ad";

    ctx.beginPath();

    ctx.moveTo(
        x + w - 12,
        y + 3
    );

    ctx.lineTo(
        x + w,
        y + h / 2
    );

    ctx.lineTo(
        x + w - 12,
        y + h - 3
    );

    ctx.closePath();

    ctx.fill();

    /* Warning stripe */

    ctx.fillStyle =
        "#d6a900";

    ctx.fillRect(
        x + 22,
        y + 4,
        9,
        h - 8
    );

    ctx.fillStyle =
        "#202020";

    ctx.fillRect(
        x + 32,
        y + 4,
        5,
        h - 8
    );

    /* Fins */

    ctx.fillStyle =
        "#3a454c";

    ctx.beginPath();

    ctx.moveTo(
        x + 15,
        y + 5
    );

    ctx.lineTo(
        x + 7,
        y - 10
    );

    ctx.lineTo(
        x + 27,
        y + 5
    );

    ctx.closePath();

    ctx.fill();

    ctx.beginPath();

    ctx.moveTo(
        x + 15,
        y + h - 5
    );

    ctx.lineTo(
        x + 7,
        y + h + 10
    );

    ctx.lineTo(
        x + 27,
        y + h - 5
    );

    ctx.closePath();

    ctx.fill();

    /* Panels */

    ctx.strokeStyle =
        "rgba(255,255,255,.35)";

    ctx.lineWidth = 1;

    for (
        let i = 0;
        i < 3;
        i++
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x + 40 +
            i * 7,
            y + 7
        );

        ctx.lineTo(
            x + 40 +
            i * 7,
            y + h - 7
        );

        ctx.stroke();

    }

}

/* =====================================================
   GIANT MISSILE
===================================================== */

function drawGiantMissile(m) {

    const x =
        m.x;

    const y =
        m.y;

    const w =
        m.w;

    const h =
        m.h;

    /* Exhaust */

    const flame =
        ctx.createLinearGradient(
            x - 65,
            y + h / 2,
            x,
            y + h / 2
        );

    flame.addColorStop(
        0,
        "rgba(255,50,0,0)"
    );

    flame.addColorStop(
        .35,
        "#ff3b00"
    );

    flame.addColorStop(
        .7,
        "#ff9800"
    );

    flame.addColorStop(
        1,
        "#fff176"
    );

    ctx.fillStyle =
        flame;

    ctx.beginPath();

    ctx.moveTo(
        x - 70,
        y + h / 2
    );

    ctx.lineTo(
        x,
        y + 8
    );

    ctx.lineTo(
        x,
        y + h - 8
    );

    ctx.closePath();

    ctx.fill();

    /* Nozzle */

    ctx.fillStyle =
        "#171b1e";

    ctx.fillRect(
        x - 8,
        y + 12,
        22,
        h - 24
    );

    /* Body */

    const body =
        ctx.createLinearGradient(
            x,
            y,
            x,
            y + h
        );

    body.addColorStop(
        0,
        "#eef2f3"
    );

    body.addColorStop(
        .3,
        "#87939a"
    );

    body.addColorStop(
        .65,
        "#4c575e"
    );

    body.addColorStop(
        1,
        "#20272b"
    );

    ctx.fillStyle =
        body;

    ctx.beginPath();

    ctx.roundRect(
        x,
        y + 5,
        w - 18,
        h - 10,
        15
    );

    ctx.fill();

    /* Nose */

    ctx.fillStyle =
        "#aeb8bd";

    ctx.beginPath();

    ctx.moveTo(
        x + w - 18,
        y + 5
    );

    ctx.lineTo(
        x + w,
        y + h / 2
    );

    ctx.lineTo(
        x + w - 18,
        y + h - 5
    );

    ctx.closePath();

    ctx.fill();

    /* Warning stripe */

    ctx.fillStyle =
        "#e0b400";

    ctx.fillRect(
        x + 42,
        y + 6,
        16,
        h - 12
    );

    ctx.fillStyle =
        "#222";

    ctx.fillRect(
        x + 60,
        y + 6,
        8,
        h - 12
    );

    /* Fins */

    ctx.fillStyle =
        "#354047";

    ctx.beginPath();

    ctx.moveTo(
        x + 30,
        y + 10
    );

    ctx.lineTo(
        x + 12,
        y - 30
    );

    ctx.lineTo(
        x + 55,
        y + 10
    );

    ctx.closePath();

    ctx.fill();

    ctx.beginPath();

    ctx.moveTo(
        x + 30,
        y + h - 10
    );

    ctx.lineTo(
        x + 12,
        y + h + 30
    );

    ctx.lineTo(
        x + 55,
        y + h - 10
    );

    ctx.closePath();

    ctx.fill();

    /* Warning symbol */

    ctx.fillStyle =
        "#111";

    ctx.beginPath();

    ctx.moveTo(
        x + 83,
        y + 18
    );

    ctx.lineTo(
        x + 105,
        y + h - 18
    );

    ctx.lineTo(
        x + 61,
        y + h - 18
    );

    ctx.closePath();

    ctx.fill();

    ctx.fillStyle =
        "#f4d03f";

    ctx.beginPath();

    ctx.moveTo(
        x + 83,
        y + 25
    );

    ctx.lineTo(
        x + 98,
        y + h - 24
    );

    ctx.lineTo(
        x + 68,
        y + h - 24
    );

    ctx.closePath();

    ctx.fill();

    ctx.fillStyle =
        "#222";

    ctx.fillRect(
        x + 81,
        y + 31,
        4,
        18
    );

    ctx.fillRect(
        x + 81,
        y + 52,
        4,
        4
    );

}

/* =====================================================
   PARTICLES
===================================================== */

function drawParticles() {

    for (
        const p of particles
    ) {

        ctx.globalAlpha =
            Math.max(
                0,
                p.life
            );

        ctx.fillStyle =
            "#ff9f43";

        ctx.fillRect(
            p.x,
            p.y,
            p.size,
            p.size
        );

    }

    ctx.globalAlpha =
        1;

}

/* =====================================================
   HUD
===================================================== */

function updateHUD() {

    document
        .getElementById("score")
        .textContent =
        "SCORE: " +
        score;

    document
        .getElementById("level")
        .textContent =
        "LEVEL: " +
        level;

    document
        .getElementById("lives")
        .textContent =
        "LIVES: " +
        "❤️".repeat(
            Math.max(
                0,
                lives
            )
        );

}

/* =====================================================
   DRAW
===================================================== */

function draw() {

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    drawBackground();

    let shakeX = 0;
    let shakeY = 0;

    if (
        screenShake > 0
    ) {

        const power =
            screenShake * 60;

        shakeX =
            (
                Math.random() -
                .5
            ) *
            power;

        shakeY =
            (
                Math.random() -
                .5
            ) *
            power;

    }

    ctx.save();

    ctx.translate(
        shakeX,
        shakeY
    );

    for (
        const m of missiles
    ) {

        drawMissile(m);

    }

    drawPlayer();

    drawParticles();

    ctx.restore();

    /* Red flash */

    if (
        redFlash > 0
    ) {

        ctx.fillStyle =
            `rgba(255,0,0,${
                redFlash * .5
            })`;

        ctx.fillRect(
            0,
            0,
            width,
            height
        );

    }

    /* PAUSED SCREEN */

    if (
        paused &&
        running
    ) {

        ctx.fillStyle =
            "rgba(0,0,0,.55)";

        ctx.fillRect(
            0,
            0,
            width,
            height
        );

        ctx.fillStyle =
            "white";

        ctx.textAlign =
            "center";

        ctx.font =
            "bold 52px Arial";

        ctx.fillText(
            "PAUSED",
            width / 2,
            height / 2
        );

        ctx.font =
            "20px Arial";

        ctx.fillText(
            "Press RESUME or P",
            width / 2,
            height / 2 + 40
        );

        ctx.textAlign =
            "left";

    }

}

/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(timestamp) {

    const dt =
        Math.min(
            (
                timestamp -
                lastTime
            ) / 1000,
            .033
        );

    lastTime =
        timestamp;

    update(dt);

    draw();

    requestAnimationFrame(
        gameLoop
    );

}

requestAnimationFrame(
    gameLoop
);

</script>
