<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Missile Mayhem</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: linear-gradient(#79cfff, #dff6ff);
}

#hud {
    position: fixed;
    top: 12px;
    left: 15px;
    z-index: 5;
    color: white;
    font-size: 20px;
    font-weight: bold;
    text-shadow: 2px 2px 4px #000;
    line-height: 1.5;
}

#pauseBtn {
    position: fixed;
    top: 12px;
    right: 15px;
    z-index: 10;
    padding: 10px 16px;
    border: none;
    border-radius: 10px;
    background: #222;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

#pauseBtn:hover {
    background: #444;
}

.menu {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.55);
}

.panel {
    width: min(420px, 90vw);
    padding: 25px;
    border-radius: 18px;
    background: rgba(20, 20, 25, 0.95);
    color: white;
    text-align: center;
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
}

.panel h1 {
    margin-top: 0;
    font-size: 42px;
}

.panel h2 {
    margin-top: 0;
}

.panel button,
.panel select {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
}

.panel button {
    background: #2d8cff;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.panel button:hover {
    background: #176dcc;
}

.custom-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 10px;
}

.custom-row label {
    flex: 1;
    text-align: left;
}

.custom-row select {
    flex: 1;
    margin-top: 0;
}

#mobileControls {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 20px;
    z-index: 8;
    display: flex;
    justify-content: space-between;
    padding: 0 25px;
    pointer-events: none;
}

.mobileButton {
    width: 110px;
    height: 65px;
    border: none;
    border-radius: 18px;
    background: rgba(0,0,0,0.65);
    color: white;
    font-size: 18px;
    font-weight: bold;
    pointer-events: auto;
    touch-action: none;
}

#duckBtn {
    background: rgba(40,40,40,0.75);
}

.hidden {
    display: none !important;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
    Score: <span id="score">0</span><br>
    Level: <span id="level">1</span><br>
    Lives: <span id="lives">❤️❤️❤️</span>
</div>

<button id="pauseBtn" onclick="togglePause()">PAUSE</button>

<div id="startMenu" class="menu">
    <div class="panel">
        <h1>🚀 Missile Mayhem</h1>
        <p>Dodge the missiles and survive!</p>

        <button onclick="openCustomize()">CUSTOMIZE</button>
        <button onclick="startGame()">START GAME</button>
    </div>
</div>

<div id="customizeMenu" class="menu hidden">
    <div class="panel">
        <h2>Customize Character</h2>

        <div class="custom-row">
            <label>Skin</label>
            <select id="skinSelect">
                <option value="#f5c6a5">Light</option>
                <option value="#d99b72">Tan</option>
                <option value="#9b633f">Brown</option>
                <option value="#5b3926">Dark</option>
            </select>
        </div>

        <div class="custom-row">
            <label>Shirt</label>
            <select id="shirtSelect">
                <option value="#2d8cff">Blue</option>
                <option value="#e53935">Red</option>
                <option value="#43a047">Green</option>
                <option value="#9c27b0">Purple</option>
                <option value="#ff9800">Orange</option>
            </select>
        </div>

        <div class="custom-row">
            <label>Pants</label>
            <select id="pantsSelect">
                <option value="#222">Black</option>
                <option value="#315a8a">Blue</option>
                <option value="#5d4037">Brown</option>
                <option value="#777">Gray</option>
            </select>
        </div>

        <div class="custom-row">
            <label>Hair</label>
            <select id="hairSelect">
                <option value="#222">Black</option>
                <option value="#5b3a29">Brown</option>
                <option value="#d6a21e">Blonde</option>
                <option value="#e53935">Red</option>
            </select>
        </div>

        <div class="custom-row">
            <label>Accessory</label>
            <select id="accessorySelect">
                <option value="none">None</option>
                <option value="cap">Cap</option>
                <option value="glasses">Glasses</option>
            </select>
        </div>

        <button onclick="saveCustomization()">SAVE</button>
        <button onclick="closeCustomize()">BACK</button>
    </div>
</div>

<div id="mobileControls">
    <button class="mobileButton" id="jumpBtn">JUMP</button>
    <button class="mobileButton" id="duckBtn">DUCK</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;

function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resize);
resize();


/* =========================
   SOUND
========================= */

let audioContext = null;

function initAudio() {
    if (!audioContext) {
        audioContext = new (
            window.AudioContext ||
            window.webkitAudioContext
        )();
    }

    if (audioContext.state === "suspended") {
        audioContext.resume();
    }
}

function sound(type) {
    if (!audioContext) return;

    const now = audioContext.currentTime;

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    if (type === "jump") {
        oscillator.type = "square";
        oscillator.frequency.setValueAtTime(280, now);
        oscillator.frequency.exponentialRampToValueAtTime(620, now + 0.12);

        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

        oscillator.start(now);
        oscillator.stop(now + 0.15);
    }

    if (type === "hit") {
        oscillator.type = "sawtooth";
        oscillator.frequency.setValueAtTime(130, now);
        oscillator.frequency.exponentialRampToValueAtTime(45, now + 0.35);

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

        oscillator.start(now);
        oscillator.stop(now + 0.35);
    }

    if (type === "score") {
        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(650, now);
        oscillator.frequency.setValueAtTime(900, now + 0.08);

        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);

        oscillator.start(now);
        oscillator.stop(now + 0.16);
    }

    if (type === "gameover") {
        oscillator.type = "sawtooth";
        oscillator.frequency.setValueAtTime(300, now);
        oscillator.frequency.exponentialRampToValueAtTime(70, now + 0.6);

        gain.gain.setValueAtTime(0.16, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

        oscillator.start(now);
        oscillator.stop(now + 0.6);
    }

    if (type === "start") {
        oscillator.type = "square";

        oscillator.frequency.setValueAtTime(350, now);
        oscillator.frequency.setValueAtTime(500, now + 0.08);
        oscillator.frequency.setValueAtTime(700, now + 0.16);

        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

        oscillator.start(now);
        oscillator.stop(now + 0.25);
    }

    if (type === "whoosh") {
        oscillator.type = "triangle";

        oscillator.frequency.setValueAtTime(180, now);
        oscillator.frequency.exponentialRampToValueAtTime(70, now + 0.25);

        gain.gain.setValueAtTime(0.035, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

        oscillator.start(now);
        oscillator.stop(now + 0.25);
    }

    if (type === "life") {
        oscillator.type = "sine";

        oscillator.frequency.setValueAtTime(500, now);
        oscillator.frequency.setValueAtTime(800, now + 0.08);
        oscillator.frequency.setValueAtTime(1100, now + 0.16);

        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

        oscillator.start(now);
        oscillator.stop(now + 0.3);
    }

    if (type === "nuke") {
        oscillator.type = "sawtooth";

        oscillator.frequency.setValueAtTime(90, now);
        oscillator.frequency.exponentialRampToValueAtTime(25, now + 1);

        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 1);

        oscillator.start(now);
        oscillator.stop(now + 1);
    }
}


/* =========================
   GAME VARIABLES
========================= */

let running = false;
let paused = false;

let score = 0;
let level = 1;
let lives = 3;

const MAX_LIVES = 3;

let missiles = [];
let powerups = [];
let particles = [];

let missileTimer = 0;
let powerupTimer = 7;

let shake = 0;
let flash = 0;

let lastTime = 0;


/* =========================
   LEVEL 20 CUTSCENE
========================= */

let nukeCutscene = false;
let nukeTimer = 0;
let nukeTriggered = false;

let playerKnockbackX = 0;
let playerKnockbackY = 0;


/* =========================
   PLAYER
========================= */

const player = {
    x: 100,
    y: 0,
    w: 34,
    h: 54,

    velocity: 0,
    jumpPower: 760,
    gravity: 1900,

    jumping: false,
    ducking: false,
    invincible: 0
};


/* =========================
   CUSTOMIZATION
========================= */

const customization = {
    skin: "#f5c6a5",
    shirt: "#2d8cff",
    pants: "#222",
    hair: "#222",
    accessory: "none"
};

function loadCustomization() {
    const saved =
        localStorage.getItem("missileMayhemCustomization");

    if (!saved) return;

    try {
        Object.assign(
            customization,
            JSON.parse(saved)
        );
    } catch {}
}

function openCustomize() {
    document
        .getElementById("startMenu")
        .classList.add("hidden");

    document
        .getElementById("customizeMenu")
        .classList.remove("hidden");

    document.getElementById("skinSelect").value =
        customization.skin;

    document.getElementById("shirtSelect").value =
        customization.shirt;

    document.getElementById("pantsSelect").value =
        customization.pants;

    document.getElementById("hairSelect").value =
        customization.hair;

    document.getElementById("accessorySelect").value =
        customization.accessory;
}

function closeCustomize() {
    document
        .getElementById("customizeMenu")
        .classList.add("hidden");

    document
        .getElementById("startMenu")
        .classList.remove("hidden");
}

function saveCustomization() {
    customization.skin =
        document.getElementById("skinSelect").value;

    customization.shirt =
        document.getElementById("shirtSelect").value;

    customization.pants =
        document.getElementById("pantsSelect").value;

    customization.hair =
        document.getElementById("hairSelect").value;

    customization.accessory =
        document.getElementById("accessorySelect").value;

    localStorage.setItem(
        "missileMayhemCustomization",
        JSON.stringify(customization)
    );

    closeCustomize();
}

loadCustomization();


/* =========================
   HUD
========================= */

function updateHUD() {
    document.getElementById("score").textContent =
        score;

    document.getElementById("level").textContent =
        level;

    let hearts = "";

    for (let i = 0; i < lives; i++) {
        hearts += "❤️";
    }

    document.getElementById("lives").textContent =
        hearts || "💀";
}


/* =========================
   START GAME
========================= */

function startGame() {
    initAudio();
    sound("start");

    score = 0;
    level = 1;
    lives = 3;

    missiles = [];
    powerups = [];
    particles = [];

    missileTimer = 0.8;
    powerupTimer = 7;

    shake = 0;
    flash = 0;

    paused = false;

    nukeCutscene = false;
    nukeTimer = 0;
    nukeTriggered = false;

    playerKnockbackX = 0;
    playerKnockbackY = 0;

    running = true;

    player.x = 100;
    player.y = H - 110;
    player.velocity = 0;
    player.jumping = false;
    player.ducking = false;
    player.invincible = 0;

    document.getElementById("pauseBtn").textContent =
        "PAUSE";

    document
        .getElementById("startMenu")
        .classList.add("hidden");

    updateHUD();

    lastTime = performance.now();
}


/* =========================
   GAME OVER
========================= */

function gameOver() {
    running = false;
    paused = false;
    nukeCutscene = false;

    sound("gameover");

    document.getElementById("pauseBtn").textContent =
        "PAUSE";

    setTimeout(() => {
        document
            .getElementById("startMenu")
            .classList.remove("hidden");
    }, 500);
}


/* =========================
   PAUSE
========================= */

function togglePause() {
    if (!running || nukeCutscene) return;

    paused = !paused;

    const button =
        document.getElementById("pauseBtn");

    if (paused) {
        button.textContent = "RESUME";
    } else {
        button.textContent = "PAUSE";
        lastTime = performance.now();
    }
}

document.addEventListener("keydown", e => {
    if (e.key.toLowerCase() === "p") {
        togglePause();
    }
});


/* =========================
   CONTROLS
========================= */

function jump() {
    if (!running || paused || nukeCutscene) return;

    if (!player.jumping && !player.ducking) {
        player.velocity =
            -player.jumpPower;

        player.jumping = true;

        sound("jump");
    }
}

function setDuck(value) {
    if (!running || paused || nukeCutscene) return;

    player.ducking = value;
}

document.addEventListener("keydown", e => {
    if (
        e.code === "Space" ||
        e.code === "ArrowUp"
    ) {
        e.preventDefault();
        jump();
    }

    if (e.code === "ArrowDown") {
        e.preventDefault();
        setDuck(true);
    }
});

document.addEventListener("keyup", e => {
    if (e.code === "ArrowDown") {
        setDuck(false);
    }
});

const jumpBtn =
    document.getElementById("jumpBtn");

const duckBtn =
    document.getElementById("duckBtn");

jumpBtn.addEventListener("pointerdown", e => {
    e.preventDefault();
    jump();
});

duckBtn.addEventListener("pointerdown", e => {
    e.preventDefault();
    setDuck(true);
});

duckBtn.addEventListener("pointerup", e => {
    e.preventDefault();
    setDuck(false);
});

duckBtn.addEventListener("pointercancel", () => {
    setDuck(false);
});

duckBtn.addEventListener("pointerleave", () => {
    setDuck(false);
});


/* =========================
   MISSILES
========================= */

function spawnMissile() {
    const giant =
        level >= 10 &&
        Math.random() < 0.15;

    const h = giant ? 52 : 30;
    const w = giant ? 125 : 85;

    /*
       Level 10+ gets a major speed boost.
    */
    const speed =
        (giant ? 470 : 400) +
        level * 22 +
        (level >= 10 ? 180 : 0);

    missiles.push({
        x: W + 60,

        y:
            H -
            100 -
            Math.random() * 250,

        w,
        h,

        speed,

        giant,

        scored: false
    });

    sound("whoosh");
}


/* =========================
   NORMAL MISSILE DRAWING
========================= */

function drawNormalMissile(m) {
    ctx.save();

    const gradient =
        ctx.createLinearGradient(
            m.x,
            m.y,
            m.x,
            m.y + m.h
        );

    gradient.addColorStop(0, "#eeeeee");
    gradient.addColorStop(0.5, "#777");
    gradient.addColorStop(1, "#333");

    ctx.fillStyle = gradient;

    ctx.beginPath();

    ctx.roundRect(
        m.x,
        m.y + 5,
        m.w - 12,
        m.h - 10,
        10
    );

    ctx.fill();

    // Nose
    ctx.fillStyle = "#bdbdbd";

    ctx.beginPath();

    ctx.moveTo(
        m.x + m.w - 12,
        m.y + 5
    );

    ctx.lineTo(
        m.x + m.w,
        m.y + m.h / 2
    );

    ctx.lineTo(
        m.x + m.w - 12,
        m.y + m.h - 5
    );

    ctx.closePath();
    ctx.fill();

    // Warning stripe
    ctx.fillStyle = "#f2c200";

    ctx.fillRect(
        m.x + m.w * 0.48,
        m.y + 5,
        8,
        m.h - 10
    );

    // Fins
    ctx.fillStyle = "#444";

    ctx.beginPath();

    ctx.moveTo(
        m.x + 20,
        m.y + 6
    );

    ctx.lineTo(
        m.x + 5,
        m.y - 10
    );

    ctx.lineTo(
        m.x + 30,
        m.y + 12
    );

    ctx.closePath();
    ctx.fill();

    ctx.beginPath();

    ctx.moveTo(
        m.x + 20,
        m.y + m.h - 6
    );

    ctx.lineTo(
        m.x + 5,
        m.y + m.h + 10
    );

    ctx.lineTo(
        m.x + 30,
        m.y + m.h - 12
    );

    ctx.closePath();
    ctx.fill();

    // Exhaust
    const flame =
        ctx.createLinearGradient(
            m.x - 30,
            0,
            m.x + 5,
            0
        );

    flame.addColorStop(0, "#ff3b00");
    flame.addColorStop(0.5, "#ffb300");
    flame.addColorStop(1, "#fff");

    ctx.fillStyle = flame;

    ctx.beginPath();

    ctx.moveTo(
        m.x + 5,
        m.y + m.h / 2
    );

    ctx.lineTo(
        m.x - 28,
        m.y + 7
    );

    ctx.lineTo(
        m.x - 18,
        m.y + m.h / 2
    );

    ctx.lineTo(
        m.x - 28,
        m.y + m.h - 7
    );

    ctx.closePath();
    ctx.fill();

    ctx.restore();
}


/* =========================
   GIANT MISSILE
========================= */

function drawGiantMissile(m) {
    ctx.save();

    const gradient =
        ctx.createLinearGradient(
            m.x,
            m.y,
            m.x,
            m.y + m.h
        );

    gradient.addColorStop(0, "#aaa");
    gradient.addColorStop(0.5, "#444");
    gradient.addColorStop(1, "#181818");

    ctx.fillStyle = gradient;

    ctx.beginPath();

    ctx.roundRect(
        m.x,
        m.y + 7,
        m.w - 18,
        m.h - 14,
        14
    );

    ctx.fill();

    ctx.fillStyle = "#bbb";

    ctx.beginPath();

    ctx.moveTo(
        m.x + m.w - 18,
        m.y + 7
    );

    ctx.lineTo(
        m.x + m.w,
        m.y + m.h / 2
    );

    ctx.lineTo(
        m.x + m.w - 18,
        m.y + m.h - 7
    );

    ctx.closePath();
    ctx.fill();

    // Warning bands
    ctx.fillStyle = "#d4a800";

    ctx.fillRect(
        m.x + m.w * 0.45,
        m.y + 7,
        10,
        m.h - 14
    );

    ctx.fillRect(
        m.x + m.w * 0.58,
        m.y + 7,
        8,
        m.h - 14
    );

    // Fins
    ctx.fillStyle = "#333";

    ctx.beginPath();

    ctx.moveTo(
        m.x + 35,
        m.y + 10
    );

    ctx.lineTo(
        m.x + 10,
        m.y - 25
    );

    ctx.lineTo(
        m.x + 50,
        m.y + 17
    );

    ctx.closePath();
    ctx.fill();

    ctx.beginPath();

    ctx.moveTo(
        m.x + 35,
        m.y + m.h - 10
    );

    ctx.lineTo(
        m.x + 10,
        m.y + m.h + 25
    );

    ctx.lineTo(
        m.x + 50,
        m.y + m.h - 17
    );

    ctx.closePath();
    ctx.fill();

    // Exhaust
    ctx.fillStyle = "#ff5a00";

    ctx.beginPath();

    ctx.moveTo(
        m.x + 10,
        m.y + m.h / 2
    );

    ctx.lineTo(
        m.x - 40,
        m.y + 5
    );

    ctx.lineTo(
        m.x - 25,
        m.y + m.h / 2
    );

    ctx.lineTo(
        m.x - 40,
        m.y + m.h - 5
    );

    ctx.closePath();
    ctx.fill();

    ctx.restore();
}


/* =========================
   MISSILE FACING PLAYER
========================= */

function drawMissile(m) {
    ctx.save();

    ctx.translate(
        m.x + m.w / 2,
        0
    );

    ctx.scale(-1, 1);

    ctx.translate(
        -(m.x + m.w / 2),
        0
    );

    if (m.giant) {
        drawGiantMissile(m);
    } else {
        drawNormalMissile(m);
    }

    ctx.restore();
}


/* =========================
   LIFE PICKUPS
========================= */

function spawnLife() {
    powerups.push({
        x: W + 40,

        y:
            100 +
            Math.random() *
            Math.max(80, H - 260),

        w: 34,
        h: 34,

        speed: 250 + level * 10,

        bob:
            Math.random() *
            Math.PI * 2
    });
}

function collectLife(p) {
    return (
        player.x < p.x + p.w &&
        player.x + player.w > p.x &&
        player.y < p.y + p.h &&
        player.y + player.h > p.y
    );
}

function drawLife(p) {
    const bobY =
        Math.sin(p.bob) * 6;

    ctx.save();

    ctx.translate(
        p.x + p.w / 2,
        p.y + p.h / 2 + bobY
    );

    ctx.shadowColor = "#ff3333";
    ctx.shadowBlur = 18;

    ctx.fillStyle = "#ff3333";

    ctx.beginPath();

    ctx.moveTo(0, 13);

    ctx.bezierCurveTo(
        -25, -4,
        -15, -20,
        0, -8
    );

    ctx.bezierCurveTo(
        15, -20,
        25, -4,
        0, 13
    );

    ctx.fill();

    ctx.shadowBlur = 0;

    ctx.fillStyle = "white";

    ctx.beginPath();

    ctx.arc(
        -7,
        -7,
        3,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.restore();
}


/* =========================
   COLLISION
========================= */

function missileHitsPlayer(m) {
    if (
        player.y + player.h <= m.y
    ) {
        return false;
    }

    return (
        player.x < m.x + m.w &&
        player.x + player.w > m.x &&
        player.y < m.y + m.h &&
        player.y + player.h > m.y
    );
}

function hitPlayer() {
    if (player.invincible > 0) return;

    lives--;

    sound("hit");

    shake = 14;
    flash = 0.25;

    player.invincible = 1.2;

    for (let i = 0; i < 18; i++) {
        particles.push({
            x:
                player.x +
                player.w / 2,

            y:
                player.y +
                player.h / 2,

            vx:
                (Math.random() - 0.5) *
                500,

            vy:
                (Math.random() - 0.5) *
                500,

            life:
                0.5 +
                Math.random() * 0.5
        });
    }

    updateHUD();

    if (lives <= 0) {
        gameOver();
    }
}


/* =========================
   LEVEL 20 NUKE CUTSCENE
========================= */

function startNukeCutscene() {
    if (
        nukeCutscene ||
        nukeTriggered
    ) {
        return;
    }

    nukeCutscene = true;
    nukeTriggered = true;

    nukeTimer = 0;

    playerKnockbackX = 0;
    playerKnockbackY = 0;

    missiles = [];

    missileTimer = 999;

    shake = 5;

    sound("nuke");
}

function updateNukeCutscene(dt) {

    nukeTimer += dt;

    // Missile coming down
    if (nukeTimer < 1.8) {
        shake = 2;
        return;
    }

    // Impact
    if (nukeTimer < 2.2) {
        shake = 35;
        flash = 0.5;
        return;
    }

    // Player launched backward
    if (nukeTimer < 3.5) {

        playerKnockbackX -=
            900 * dt;

        playerKnockbackY -=
            650 * dt;

        player.x +=
            playerKnockbackX * dt;

        player.y +=
            playerKnockbackY * dt;

        playerKnockbackY +=
            1200 * dt;

        shake = 20;

        return;
    }

    // Finish cutscene
    nukeCutscene = false;

    player.x = 100;
    player.y = H - 110;

    player.velocity = 0;

    lives = Math.max(
        1,
        lives - 1
    );

    updateHUD();

    missileTimer = 1;
    powerupTimer = 5;
}

function drawNukeCutscene() {
    if (!nukeCutscene) return;

    ctx.fillStyle =
        "rgba(0,0,0,0.35)";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    const progress =
        Math.min(
            nukeTimer / 1.8,
            1
        );

    const nukeX =
        W / 2;

    const nukeY =
        -150 +
        progress *
        (H * 0.6);

    // Nuke
    ctx.save();

    ctx.shadowColor =
        "#ff3300";

    ctx.shadowBlur = 30;

    const gradient =
        ctx.createLinearGradient(
            nukeX - 25,
            nukeY,
            nukeX + 25,
            nukeY
        );

    gradient.addColorStop(
        0,
        "#222"
    );

    gradient.addColorStop(
        0.5,
        "#777"
    );

    gradient.addColorStop(
        1,
        "#222"
    );

    ctx.fillStyle = gradient;

    ctx.fillRect(
        nukeX - 25,
        nukeY,
        50,
        110
    );

    // Nose
    ctx.fillStyle = "#444";

    ctx.beginPath();

    ctx.moveTo(
        nukeX - 25,
        nukeY + 110
    );

    ctx.lineTo(
        nukeX,
        nukeY + 145
    );

    ctx.lineTo(
        nukeX + 25,
        nukeY + 110
    );

    ctx.closePath();

    ctx.fill();

    // Warning stripe
    ctx.fillStyle = "#e0b000";

    ctx.fillRect(
        nukeX - 25,
        nukeY + 45,
        50,
        15
    );

    // Fins
    ctx.fillStyle = "#333";

    ctx.beginPath();

    ctx.moveTo(
        nukeX - 25,
        nukeY + 15
    );

    ctx.lineTo(
        nukeX - 55,
        nukeY - 10
    );

    ctx.lineTo(
        nukeX - 20,
        nukeY + 35
    );

    ctx.closePath();

    ctx.fill();

    ctx.beginPath();

    ctx.moveTo(
        nukeX + 25,
        nukeY + 15
    );

    ctx.lineTo(
        nukeX + 55,
        nukeY - 10
    );

    ctx.lineTo(
        nukeX + 20,
        nukeY + 35
    );

    ctx.closePath();

    ctx.fill();

    ctx.restore();

    // Explosion
    if (nukeTimer >= 1.8) {

        const explosionProgress =
            Math.min(
                (nukeTimer - 1.8) / 0.8,
                1
            );

        const radius =
            50 +
            explosionProgress *
            300;

        const explosion =
            ctx.createRadialGradient(
                nukeX,
                H * 0.55,
                10,
                nukeX,
                H * 0.55,
                radius
            );

        explosion.addColorStop(
            0,
            "white"
        );

        explosion.addColorStop(
            0.2,
            "#ffd43b"
        );

        explosion.addColorStop(
            0.5,
            "#ff6b00"
        );

        explosion.addColorStop(
            1,
            "rgba(255,60,0,0)"
        );

        ctx.fillStyle = explosion;

        ctx.beginPath();

        ctx.arc(
            nukeX,
            H * 0.55,
            radius,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    // Text
    ctx.fillStyle = "white";
    ctx.textAlign = "center";

    if (nukeTimer < 1.8) {

        ctx.font =
            "bold 32px Arial";

        ctx.fillText(
            "⚠ INCOMING ⚠",
            W / 2,
            100
        );

    } else if (nukeTimer < 3.5) {

        ctx.font =
            "bold 42px Arial";

        ctx.fillText(
            "LEVEL 20!",
            W / 2,
            100
        );
    }

    ctx.textAlign = "left";
}


/* =========================
   UPDATE
========================= */

function update(dt) {

    if (!running) return;

    if (nukeCutscene) {
        updateNukeCutscene(dt);
        return;
    }

    if (paused) return;

    // Player physics
    player.velocity +=
        player.gravity * dt;

    player.y +=
        player.velocity * dt;

    const groundY =
        H - 110;

    if (player.y >= groundY) {

        player.y = groundY;

        player.velocity = 0;

        player.jumping = false;
    }

    if (player.invincible > 0) {
        player.invincible -= dt;
    }

    // Duck
    if (
        player.ducking &&
        !player.jumping
    ) {
        player.h = 32;

        player.y =
            groundY + 22;

    } else if (!player.jumping) {

        player.h = 54;

        player.y = groundY;
    }


    /* MISSILES */

    missileTimer -= dt;

    if (missileTimer <= 0) {

        spawnMissile();

        const minimumDelay =
            Math.max(
                0.35,
                1.2 - level * 0.045
            );

        missileTimer =
            minimumDelay +
            Math.random() * 0.8;
    }

    for (
        let i = missiles.length - 1;
        i >= 0;
        i--
    ) {

        const m = missiles[i];

        m.x -=
            m.speed * dt;

        if (
            missileHitsPlayer(m)
        ) {

            hitPlayer();

            missiles.splice(i, 1);

            continue;
        }

        if (
            !m.scored &&
            m.x + m.w <
            player.x
        ) {

            m.scored = true;

            score++;

            sound("score");

            level =
                Math.floor(
                    score / 10
                ) + 1;

            updateHUD();

            // Level 20 cinematic
            if (
                level >= 20 &&
                !nukeTriggered
            ) {
                startNukeCutscene();
                break;
            }
        }

        if (
            m.x + m.w < -100
        ) {
            missiles.splice(i, 1);
        }
    }


    /* LIFE PICKUPS */

    powerupTimer -= dt;

    if (powerupTimer <= 0) {

        powerupTimer =
            12 +
            Math.random() * 8;

        if (lives < MAX_LIVES) {
            spawnLife();
        }
    }

    for (
        let i = powerups.length - 1;
        i >= 0;
        i--
    ) {

        const p = powerups[i];

        p.x -=
            p.speed * dt;

        p.bob +=
            dt * 4;

        if (
            collectLife(p)
        ) {

            if (
                lives < MAX_LIVES
            ) {

                lives++;

                sound("life");

                shake = 5;

                updateHUD();

                powerups.splice(i, 1);

                continue;
            }
        }

        if (
            p.x + p.w < -50
        ) {
            powerups.splice(i, 1);
        }
    }


    /* PARTICLES */

    for (
        let i = particles.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            particles[i];

        p.x +=
            p.vx * dt;

        p.y +=
            p.vy * dt;

        p.vy +=
            900 * dt;

        p.life -= dt;

        if (
            p.life <= 0
        ) {
            particles.splice(i, 1);
        }
    }

    shake *=
        Math.pow(
            0.02,
            dt
        );

    if (flash > 0) {
        flash -= dt;
    }
}


/* =========================
   DRAW PLAYER
========================= */

function drawPlayer() {

    if (
        player.invincible > 0
    ) {

        if (
            Math.floor(
                player.invincible * 12
            ) % 2 === 0
        ) {
            return;
        }
    }

    const x = player.x;
    const y = player.y;

    ctx.save();

    // Legs
    ctx.fillStyle =
        customization.pants;

    if (player.ducking) {

        ctx.fillRect(
            x + 5,
            y + 23,
            12,
            20
        );

        ctx.fillRect(
            x + 18,
            y + 23,
            12,
            20
        );

    } else {

        ctx.fillRect(
            x + 5,
            y + 34,
            10,
            20
        );

        ctx.fillRect(
            x + 19,
            y + 34,
            10,
            20
        );
    }

    // Body
    ctx.fillStyle =
        customization.shirt;

    if (player.ducking) {

        ctx.fillRect(
            x + 3,
            y + 10,
            29,
            20
        );

    } else {

        ctx.fillRect(
            x + 4,
            y + 13,
            26,
            25
        );
    }

    // Head
    ctx.fillStyle =
        customization.skin;

    ctx.beginPath();

    ctx.arc(
        x + 17,
        y + 8,
        10,
        0,
        Math.PI * 2
    );

    ctx.fill();

    // Hair
    ctx.fillStyle =
        customization.hair;

    ctx.beginPath();

    ctx.arc(
        x + 17,
        y + 4,
        10,
        Math.PI,
        Math.PI * 2
    );

    ctx.fill();

    // Cap
    if (
        customization.accessory ===
        "cap"
    ) {

        ctx.fillStyle = "#222";

        ctx.fillRect(
            x + 6,
            y - 3,
            22,
            5
        );

        ctx.fillRect(
            x + 17,
            y - 5,
            8,
            4
        );
    }

    // Glasses
    if (
        customization.accessory ===
        "glasses"
    ) {

        ctx.strokeStyle =
            "#111";

        ctx.lineWidth = 2;

        ctx.strokeRect(
            x + 8,
            y + 4,
            7,
            5
        );

        ctx.strokeRect(
            x + 18,
            y + 4,
            7,
            5
        );

        ctx.beginPath();

        ctx.moveTo(
            x + 15,
            y + 6
        );

        ctx.lineTo(
            x + 18,
            y + 6
        );

        ctx.stroke();
    }

    ctx.restore();
}


/* =========================
   BACKGROUND
========================= */

function drawBackground() {

    ctx.fillStyle =
        "#6e8b3d";

    ctx.fillRect(
        0,
        H - 55,
        W,
        55
    );

    ctx.fillStyle =
        "#405523";

    ctx.fillRect(
        0,
        H - 55,
        W,
        5
    );

    // Clouds
    ctx.fillStyle =
        "rgba(255,255,255,0.7)";

    for (
        let i = 0;
        i < 5;
        i++
    ) {

        const x =
            ((i * 250) -
            (score * 2)) %
            (W + 300);

        const y =
            80 +
            (i % 3) * 70;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            25,
            0,
            Math.PI * 2
        );

        ctx.arc(
            x + 30,
            y - 10,
            32,
            0,
            Math.PI * 2
        );

        ctx.arc(
            x + 65,
            y,
            25,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}


/* =========================
   PARTICLES
========================= */

function drawParticles() {

    for (
        const p of particles
    ) {

        ctx.globalAlpha =
            Math.max(
                0,
                p.life * 2
            );

        ctx.fillStyle =
            "#ffcc33";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            3,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.globalAlpha = 1;
}


/* =========================
   DRAW
========================= */

function draw() {

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    ctx.save();

    if (shake > 0.5) {

        ctx.translate(
            (Math.random() - 0.5) *
            shake,

            (Math.random() - 0.5) *
            shake
        );
    }

    drawBackground();

    for (
        const m of missiles
    ) {
        drawMissile(m);
    }

    for (
        const p of powerups
    ) {
        drawLife(p);
    }

    drawPlayer();

    drawParticles();

    ctx.restore();

    // Hit flash
    if (flash > 0) {

        ctx.fillStyle =
            `rgba(255,0,0,${Math.min(
                flash,
                0.25
            )})`;

        ctx.fillRect(
            0,
            0,
            W,
            H
        );
    }

    // Level 20 cinematic
    drawNukeCutscene();

    // Pause
    if (paused) {

        ctx.fillStyle =
            "rgba(0,0,0,0.45)";

        ctx.fillRect(
            0,
            0,
            W,
            H
        );

        ctx.fillStyle =
            "white";

        ctx.font =
            "bold 48px Arial";

        ctx.textAlign =
            "center";

        ctx.fillText(
            "PAUSED",
            W / 2,
            H / 2
        );

        ctx.font =
            "20px Arial";

        ctx.fillText(
            "Press P or RESUME to continue",
            W / 2,
            H / 2 + 40
        );

        ctx.textAlign =
            "left";
    }
}


/* =========================
   GAME LOOP
========================= */

function gameLoop(time) {

    const dt =
        Math.min(
            (time - lastTime) / 1000,
            0.033
        );

    lastTime = time;

    update(dt);
    draw();

    requestAnimationFrame(
        gameLoop
    );
}

requestAnimationFrame(
    gameLoop
);
</script>
