<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Missile Mayhem</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #05070d;
    color: white;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}

/* HUD */
#hud {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 10;
    font-size: 18px;
    font-weight: bold;
    text-shadow: 2px 2px 4px #000;
}

#pauseBtn {
    position: fixed;
    top: 15px;
    right: 15px;
    z-index: 20;
    padding: 10px 18px;
    border: none;
    border-radius: 9px;
    background: #222;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

/* MAIN MENU */
#menu {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,.82);
    text-align: center;
}

#menu h1 {
    font-size: clamp(42px, 9vw, 82px);
    color: #ffd21f;
    text-shadow:
        0 0 10px #ff6b00,
        0 0 30px #ff2d00;
    margin-bottom: 10px;
}

#menu p {
    margin: 5px;
    color: #eee;
}

.menuButton {
    margin-top: 14px;
    padding: 13px 30px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg,#ff5e00,#ffcc00);
    color: white;
    font-size: 19px;
    font-weight: bold;
    cursor: pointer;
}

/* CUSTOMIZATION */
#customization {
    margin-top: 12px;
    display: grid;
    gap: 5px;
}

select {
    padding: 6px;
    border-radius: 6px;
}

/* SHOP */
#shop {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(5,7,13,.97);
    text-align: center;
}

#shop h2 {
    font-size: 42px;
    color: #ffd21f;
    margin-bottom: 8px;
}

#coinBalance {
    font-size: 22px;
    margin-bottom: 20px;
}

.shopGrid {
    display: grid;
    grid-template-columns: repeat(2,minmax(140px,220px));
    gap: 12px;
    width: 90%;
    max-width: 500px;
}

.shopItem {
    padding: 15px;
    border-radius: 12px;
    background: linear-gradient(145deg,#171c25,#242b36);
    border: 2px solid #4c5665;
}

.shopItem h3 {
    margin-bottom: 7px;
}

.shopItem p {
    color: #bbb;
    margin-bottom: 10px;
}

.shopItem button {
    padding: 8px 15px;
    border: none;
    border-radius: 7px;
    background: #ffd21f;
    color: #111;
    font-weight: bold;
    cursor: pointer;
}

.shopItem button:disabled {
    background: #555;
    color: #aaa;
}

/* MOBILE */
#mobileControls {
    position: fixed;
    bottom: 20px;
    left: 0;
    right: 0;
    z-index: 15;
    display: flex;
    justify-content: space-between;
    padding: 0 20px;
    pointer-events: none;
}

.control {
    pointer-events: auto;
    width: 100px;
    height: 65px;
    border: none;
    border-radius: 15px;
    color: white;
    font-weight: bold;
    font-size: 18px;
    backdrop-filter: blur(5px);
}

#jumpBtn {
    background: rgba(0,150,255,.5);
}

#duckBtn {
    background: rgba(100,100,100,.55);
}

.hidden {
    display: none !important;
}

@media(max-width:600px) {
    .shopGrid {
        grid-template-columns: 1fr 1fr;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud"></div>

<button id="pauseBtn" onclick="togglePause()">PAUSE</button>

<div id="mobileControls">
    <button class="control" id="duckBtn">DUCK</button>
    <button class="control" id="jumpBtn" onclick="jump()">JUMP</button>
</div>


<!-- MAIN MENU -->

<div id="menu">

    <h1>MISSILE MAYHEM</h1>

    <p id="menuMessage">
        Jump, double-jump, duck, and survive!
    </p>

    <p>🪙 Collect coins and buy items in the shop!</p>
    <p>🌎 The habitat changes every level!</p>

    <div id="customization">

        <label>
            Skin:
            <select id="skin">
                <option value="#ffd2a6">Light</option>
                <option value="#c68642">Tan</option>
                <option value="#8d5524">Brown</option>
                <option value="#f1c27d">Warm</option>
            </select>
        </label>

        <label>
            Shirt:
            <select id="shirt">
                <option value="#3498db">Blue</option>
                <option value="#e74c3c">Red</option>
                <option value="#2ecc71">Green</option>
                <option value="#9b59b6">Purple</option>
                <option value="#f1c40f">Yellow</option>
            </select>
        </label>

        <label>
            Pants:
            <select id="pants">
                <option value="#222222">Black</option>
                <option value="#34495e">Dark Blue</option>
                <option value="#795548">Brown</option>
                <option value="#ecf0f1">White</option>
            </select>
        </label>

        <label>
            Hair:
            <select id="hair">
                <option value="#151515">Black</option>
                <option value="#6b3e26">Brown</option>
                <option value="#d4a017">Blonde</option>
                <option value="#eeeeee">Gray</option>
            </select>
        </label>

        <label>
            Accessory:
            <select id="accessory">
                <option value="none">None</option>
                <option value="cap">Cap</option>
                <option value="glasses">Glasses</option>
            </select>
        </label>

    </div>

    <button class="menuButton" onclick="startGame()">
        START GAME
    </button>

    <button class="menuButton" onclick="openShop()">
        🛒 SHOP
    </button>

</div>


<!-- SHOP -->

<div id="shop">

    <h2>🛒 COIN SHOP</h2>

    <div id="coinBalance">
        🪙 Coins: <span id="shopCoins">0</span>
    </div>

    <div class="shopGrid">

        <div class="shopItem">
            <h3>🥇 Golden Outfit</h3>
            <p>50 coins</p>
            <button onclick="buyItem('gold')" id="goldButton">
                BUY
            </button>
        </div>

        <div class="shopItem">
            <h3>🥷 Ninja Outfit</h3>
            <p>100 coins</p>
            <button onclick="buyItem('ninja')" id="ninjaButton">
                BUY
            </button>
        </div>

        <div class="shopItem">
            <h3>🤖 Robot Outfit</h3>
            <p>150 coins</p>
            <button onclick="buyItem('robot')" id="robotButton">
                BUY
            </button>
        </div>

        <div class="shopItem">
            <h3>🧲 Coin Magnet</h3>
            <p>200 coins</p>
            <button onclick="buyItem('magnet')" id="magnetButton">
                BUY
            </button>
        </div>

    </div>

    <button
        class="menuButton"
        onclick="closeShop()">
        BACK
    </button>

</div>


<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

let dpr = Math.min(
    devicePixelRatio || 1,
    2
);

function resize() {

    W = innerWidth;
    H = innerHeight;

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

addEventListener("resize",resize);
resize();


// =====================================
// PLAYER
// =====================================

const player = {

    x: 100,
    y: 0,

    w: 34,
    h: 54,

    velocity: 0,

    jumpPower: 760,
    gravity: 1900,

    jumping: false,

    // DOUBLE JUMP
    jumpCount: 0,
    maxJumps: 2,

    ducking: false,

    invincible: 0
};


// =====================================
// GAME
// =====================================

let running = false;
let paused = false;

let score = 0;
let level = 1;
let lives = 3;

const MAX_LIVES = 3;

let missiles = [];
let particles = [];
let powerups = [];
let coinsList = [];

let missileTimer = 1;
let powerupTimer = 7;
let coinTimer = 2;

let shake = 0;
let hitFlash = 0;

let lastTime = 0;


// =====================================
// COINS / SHOP SAVE DATA
// =====================================

let coins = Number(
    localStorage.getItem("missileCoins") || 0
);

let purchasedItems = JSON.parse(
    localStorage.getItem("missileShopItems") || "{}"
);


// =====================================
// CUSTOMIZATION
// =====================================

const customization = {

    skin: "#ffd2a6",
    shirt: "#3498db",
    pants: "#222222",
    hair: "#151515",
    accessory: "none"
};

function loadCustomization() {

    try {

        const saved =
            JSON.parse(
                localStorage.getItem(
                    "missileCustomization"
                )
            );

        if (saved) {

            Object.assign(
                customization,
                saved
            );

            document.getElementById("skin").value =
                customization.skin;

            document.getElementById("shirt").value =
                customization.shirt;

            document.getElementById("pants").value =
                customization.pants;

            document.getElementById("hair").value =
                customization.hair;

            document.getElementById("accessory").value =
                customization.accessory;
        }

    } catch {}
}

function saveCustomization() {

    customization.skin =
        document.getElementById("skin").value;

    customization.shirt =
        document.getElementById("shirt").value;

    customization.pants =
        document.getElementById("pants").value;

    customization.hair =
        document.getElementById("hair").value;

    customization.accessory =
        document.getElementById("accessory").value;

    localStorage.setItem(
        "missileCustomization",
        JSON.stringify(customization)
    );
}

document
.querySelectorAll("#customization select")
.forEach(select => {

    select.addEventListener(
        "change",
        saveCustomization
    );

});

loadCustomization();


// =====================================
// HABITATS
// =====================================

const habitats = [

    {
        name: "Emerald Forest",
        sky1: "#42d66b",
        sky2: "#9af7a2",
        ground: "#245b32",
        groundTop: "#5ee477",
        accent: "#1f8f45",
        type: "forest"
    },

    {
        name: "Golden Desert",
        sky1: "#ff9d2e",
        sky2: "#ffe28a",
        ground: "#c98235",
        groundTop: "#ffd05a",
        accent: "#e99b35",
        type: "desert"
    },

    {
        name: "Crystal Coast",
        sky1: "#20c9e8",
        sky2: "#9bf5ff",
        ground: "#187c91",
        groundTop: "#5de9f5",
        accent: "#1aafc5",
        type: "ocean"
    },

    {
        name: "Frozen Peaks",
        sky1: "#6eb8ff",
        sky2: "#dff7ff",
        ground: "#6889aa",
        groundTop: "#e9fbff",
        accent: "#bdeeff",
        type: "snow"
    },

    {
        name: "Volcano Valley",
        sky1: "#d91e36",
        sky2: "#ff9d00",
        ground: "#351b1b",
        groundTop: "#ff4d19",
        accent: "#ff9e00",
        type: "volcano"
    },

    {
        name: "Tropical Jungle",
        sky1: "#18b96f",
        sky2: "#b8f05b",
        ground: "#155c38",
        groundTop: "#43d66f",
        accent: "#a5e84d",
        type: "jungle"
    },

    {
        name: "Star Galaxy",
        sky1: "#34158f",
        sky2: "#b329d6",
        ground: "#19134c",
        groundTop: "#674eea",
        accent: "#ef55ff",
        type: "space"
    },

    {
        name: "Neon City",
        sky1: "#141452",
        sky2: "#ec2b9f",
        ground: "#151526",
        groundTop: "#21e6ff",
        accent: "#ff31c8",
        type: "city"
    },

    {
        name: "Cherry Valley",
        sky1: "#ff76a8",
        sky2: "#ffd2e6",
        ground: "#6b3951",
        groundTop: "#ff8db9",
        accent: "#ffbad4",
        type: "cherry"
    },

    {
        name: "Cloud Kingdom",
        sky1: "#58c8ff",
        sky2: "#e8fbff",
        ground: "#6b86e8",
        groundTop: "#ffffff",
        accent: "#d5f7ff",
        type: "cloud"
    }
];

function getHabitat() {

    return habitats[
        (level - 1) %
        habitats.length
    ];
}


// =====================================
// AUDIO
// =====================================

let audioCtx = null;

function initAudio() {

    if (!audioCtx) {

        audioCtx = new (
            window.AudioContext ||
            window.webkitAudioContext
        )();
    }

    if (
        audioCtx.state === "suspended"
    ) {

        audioCtx.resume();
    }
}

function sound(type) {

    if (!audioCtx) return;

    const osc =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();

    osc.connect(gain);
    gain.connect(
        audioCtx.destination
    );

    const now =
        audioCtx.currentTime;


    if (type === "jump") {

        osc.frequency.setValueAtTime(
            400,
            now
        );

        osc.frequency.exponentialRampToValueAtTime(
            750,
            now + .12
        );

        gain.gain.setValueAtTime(
            .12,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            now + .15
        );

        osc.start();
        osc.stop(now + .15);
    }


    else if (type === "coin") {

        osc.frequency.setValueAtTime(
            700,
            now
        );

        osc.frequency.exponentialRampToValueAtTime(
            1200,
            now + .12
        );

        gain.gain.setValueAtTime(
            .1,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            now + .15
        );

        osc.start();
        osc.stop(now + .15);
    }


    else if (type === "hit") {

        osc.frequency.setValueAtTime(
            120,
            now
        );

        osc.frequency.exponentialRampToValueAtTime(
            50,
            now + .25
        );

        gain.gain.setValueAtTime(
            .2,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            now + .25
        );

        osc.start();
        osc.stop(now + .25);
    }


    else if (type === "score") {

        osc.frequency.setValueAtTime(
            600,
            now
        );

        osc.frequency.exponentialRampToValueAtTime(
            900,
            now + .08
        );

        gain.gain.setValueAtTime(
            .08,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            now + .1
        );

        osc.start();
        osc.stop(now + .1);
    }


    else if (type === "whoosh") {

        osc.frequency.setValueAtTime(
            900,
            now
        );

        osc.frequency.exponentialRampToValueAtTime(
            150,
            now + .25
        );

        gain.gain.setValueAtTime(
            .08,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            now + .25
        );

        osc.start();
        osc.stop(now + .25);
    }


    else if (type === "life") {

        osc.frequency.setValueAtTime(
            500,
            now
        );

        osc.frequency.exponentialRampToValueAtTime(
            1000,
            now + .2
        );

        gain.gain.setValueAtTime(
            .1,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            now + .25
        );

        osc.start();
        osc.stop(now + .25);
    }


    else if (type === "start") {

        osc.frequency.setValueAtTime(
            300,
            now
        );

        osc.frequency.exponentialRampToValueAtTime(
            700,
            now + .25
        );

        gain.gain.setValueAtTime(
            .1,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            now + .25
        );

        osc.start();
        osc.stop(now + .25);
    }
}


// =====================================
// DOUBLE JUMP
// =====================================

function jump() {

    if (
        !running ||
        paused
    ) return;

    if (
        player.jumpCount <
        player.maxJumps
    ) {

        player.velocity =
            -player.jumpPower;

        player.jumping = true;

        player.jumpCount++;

        sound("jump");


        if (
            player.jumpCount === 2
        ) {

            for (
                let i = 0;
                i < 8;
                i++
            ) {

                particles.push({

                    x:
                        player.x +
                        player.w / 2,

                    y:
                        player.y +
                        player.h,

                    vx:
                        (Math.random() - .5) *
                        160,

                    vy:
                        Math.random() *
                        80,

                    life: .35,

                    maxLife: .35,

                    size: 4
                });
            }
        }
    }
}


// =====================================
// CONTROLS
// =====================================

document.addEventListener(
    "keydown",
    e => {

        if (
            e.code === "Space" ||
            e.code === "ArrowUp" ||
            e.code === "KeyW"
        ) {

            e.preventDefault();

            jump();
        }

        if (
            e.code === "KeyP"
        ) {

            togglePause();
        }

        if (
            e.code === "ArrowDown" ||
            e.code === "KeyS"
        ) {

            player.ducking = true;
        }
    }
);

document.addEventListener(
    "keyup",
    e => {

        if (
            e.code === "ArrowDown" ||
            e.code === "KeyS"
        ) {

            player.ducking = false;
        }
    }
);


const duckBtn =
    document.getElementById(
        "duckBtn"
    );


duckBtn.addEventListener(
    "pointerdown",
    () => {

        player.ducking = true;
    }
);

duckBtn.addEventListener(
    "pointerup",
    () => {

        player.ducking = false;
    }
);

duckBtn.addEventListener(
    "pointercancel",
    () => {

        player.ducking = false;
    }
);


// =====================================
// MISSILES
// =====================================

function spawnMissile() {

    const giant =
        level >= 10 &&
        Math.random() < .15;

    const w =
        giant ? 90 : 70;

    const h =
        giant ? 34 : 24;

    const groundY =
        H - 110;

    const speed =
        (giant ? 470 : 400) +
        level * 22 +
        (level >= 10 ? 180 : 0);

    missiles.push({

        x:
            W + 80,

        y:
            groundY - h,

        w,
        h,

        speed,
        giant
    });

    sound("whoosh");
}


// =====================================
// COINS
// =====================================

function spawnCoin() {

    coinsList.push({

        x:
            W + 40,

        y:
            H - 160 -
            Math.random() * 250,

        w: 26,
        h: 26,

        speed:
            280 + level * 8,

        rotation: 0
    });
}


function drawCoin(c) {

    c.rotation += .08;

    const squash =
        Math.abs(
            Math.cos(c.rotation)
        );

    ctx.save();

    ctx.translate(
        c.x + c.w / 2,
        c.y + c.h / 2
    );

    ctx.scale(
        .45 + squash * .55,
        1
    );

    ctx.shadowColor =
        "#ffd21f";

    ctx.shadowBlur = 15;

    ctx.fillStyle =
        "#ffd21f";

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        13,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.shadowBlur = 0;

    ctx.strokeStyle =
        "#b77b00";

    ctx.lineWidth = 3;

    ctx.stroke();

    ctx.fillStyle =
        "#fff2a3";

    ctx.font =
        "bold 15px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        "$",
        0,
        1
    );

    ctx.restore();
}


function collectCoin(index) {

    coins++;

    localStorage.setItem(
        "missileCoins",
        coins
    );

    sound("coin");

    for (
        let i = 0;
        i < 8;
        i++
    ) {

        particles.push({

            x:
                coinsList[index].x +
                13,

            y:
                coinsList[index].y +
                13,

            vx:
                (Math.random() - .5) *
                180,

            vy:
                -Math.random() *
                150,

            life: .4,

            maxLife: .4,

            size: 4
        });
    }

    coinsList.splice(
        index,
        1
    );

    updateCoinHUD();
}


// =====================================
// SHOP
// =====================================

const shopPrices = {

    gold: 50,
    ninja: 100,
    robot: 150,
    magnet: 200
};


function openShop() {

    updateShop();

    document.getElementById(
        "shop"
    ).style.display = "flex";

    document.getElementById(
        "menu"
    ).classList.add("hidden");
}


function closeShop() {

    document.getElementById(
        "shop"
    ).style.display = "none";

    document.getElementById(
        "menu"
    ).classList.remove("hidden");
}


function buyItem(item) {

    if (
        purchasedItems[item]
    ) {

        equipItem(item);

        return;
    }

    const price =
        shopPrices[item];

    if (
        coins < price
    ) {

        alert(
            "You need " +
            (price - coins) +
            " more coins!"
        );

        return;
    }

    coins -= price;

    purchasedItems[item] =
        true;

    localStorage.setItem(
        "missileCoins",
        coins
    );

    localStorage.setItem(
        "missileShopItems",
        JSON.stringify(
            purchasedItems
        )
    );

    equipItem(item);

    updateShop();
    updateCoinHUD();
}


function equipItem(item) {

    if (
        item === "gold"
    ) {

        customization.shirt =
            "#ffd21f";

        customization.pants =
            "#a87800";

        customization.hair =
            "#fff1a0";
    }

    else if (
        item === "ninja"
    ) {

        customization.shirt =
            "#171717";

        customization.pants =
            "#080808";

        customization.hair =
            "#111111";

        customization.accessory =
            "cap";
    }

    else if (
        item === "robot"
    ) {

        customization.shirt =
            "#9da7b3";

        customization.pants =
            "#59636e";

        customization.hair =
            "#d9e0e7";

        customization.accessory =
            "glasses";
    }

    saveCustomization();

    updateShop();
}


function updateShop() {

    updateCoinHUD();

    const items = [
        "gold",
        "ninja",
        "robot",
        "magnet"
    ];

    items.forEach(item => {

        const button =
            document.getElementById(
                item + "Button"
            );

        if (
            purchasedItems[item]
        ) {

            button.textContent =
                item === "magnet"
                    ? "OWNED"
                    : "EQUIP";

            button.disabled = false;

        } else {

            button.textContent =
                "BUY";

            button.disabled =
                coins <
                shopPrices[item];
        }
    });
}

function updateHUD() {

}


// =====================================
// MISSILE DRAWING
// =====================================

function drawMissile(m) {

    ctx.save();

    ctx.translate(
        m.x + m.w / 2,
        0
    );

    ctx.scale(
        -1,
        1
    );

    ctx.translate(
        -(m.x + m.w / 2),
        0
    );

    const x = m.x;
    const y = m.y;


    // Flame

    ctx.fillStyle =
        "#ff7b00";

    ctx.beginPath();

    ctx.moveTo(
        x + 5,
        y + m.h / 2
    );

    ctx.lineTo(
        x - 25,
        y + 5
    );

    ctx.lineTo(
        x - 15,
        y + m.h / 2
    );

    ctx.lineTo(
        x - 25,
        y + m.h - 5
    );

    ctx.closePath();

    ctx.fill();


    ctx.fillStyle =
        "#ffe44d";

    ctx.beginPath();

    ctx.moveTo(
        x + 5,
        y + m.h / 2
    );

    ctx.lineTo(
        x - 13,
        y + 9
    );

    ctx.lineTo(
        x - 8,
        y + m.h / 2
    );

    ctx.lineTo(
        x - 13,
        y + m.h - 9
    );

    ctx.closePath();

    ctx.fill();


    // Body

    const gradient =
        ctx.createLinearGradient(
            x,
            y,
            x,
            y + m.h
        );

    gradient.addColorStop(
        0,
        "#e8edf2"
    );

    gradient.addColorStop(
        .5,
        "#78828e"
    );

    gradient.addColorStop(
        1,
        "#303740"
    );

    ctx.fillStyle =
        gradient;

    ctx.beginPath();

    ctx.roundRect(
        x + 8,
        y + 4,
        m.w - 20,
        m.h - 8,
        8
    );

    ctx.fill();


    // Nose

    ctx.fillStyle =
        "#b8bec7";

    ctx.beginPath();

    ctx.moveTo(
        x + m.w - 15,
        y + m.h / 2
    );

    ctx.lineTo(
        x + m.w,
        y
    );

    ctx.lineTo(
        x + m.w,
        y + m.h
    );

    ctx.closePath();

    ctx.fill();


    // Stripe

    ctx.fillStyle =
        "#e5b300";

    ctx.fillRect(
        x + m.w * .48,
        y + 3,
        7,
        m.h - 6
    );


    // Fins

    ctx.fillStyle =
        "#39424c";

    ctx.beginPath();

    ctx.moveTo(
        x + 20,
        y + 3
    );

    ctx.lineTo(
        x + 7,
        y - 16
    );

    ctx.lineTo(
        x + 32,
        y + 6
    );

    ctx.closePath();

    ctx.fill();

    ctx.beginPath();

    ctx.moveTo(
        x + 20,
        y + m.h - 3
    );

    ctx.lineTo(
        x + 7,
        y + m.h + 16
    );

    ctx.lineTo(
        x + 32,
        y + m.h - 6
    );

    ctx.closePath();

    ctx.fill();

    ctx.restore();
}


// =====================================
// PLAYER DRAW
// =====================================

function drawPlayer() {

    const x =
        player.x;

    const groundY =
        H - 110;

    let y =
        player.y;

    let h =
        player.ducking
            ? 34
            : player.h;


    if (
        player.ducking
    ) {

        y =
            groundY - h;
    }


    // Shadow

    ctx.fillStyle =
        "rgba(0,0,0,.3)";

    ctx.beginPath();

    ctx.ellipse(
        x + player.w / 2,
        groundY + 3,
        player.ducking ? 20 : 18,
        6,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // Legs

    ctx.fillStyle =
        customization.pants;

    if (
        player.ducking
    ) {

        ctx.fillRect(
            x + 4,
            y + 25,
            26,
            8
        );

    } else {

        ctx.fillRect(
            x + 6,
            y + 34,
            9,
            20
        );

        ctx.fillRect(
            x + 20,
            y + 34,
            9,
            20
        );
    }


    // Body

    ctx.fillStyle =
        customization.shirt;

    if (
        player.ducking
    ) {

        ctx.fillRect(
            x + 3,
            y + 9,
            29,
            19
        );

    } else {

        ctx.fillRect(
            x + 5,
            y + 15,
            25,
            25
        );
    }


    // Head

    ctx.fillStyle =
        customization.skin;

    ctx.beginPath();

    ctx.arc(
        x + player.w / 2,
        y + 8,
        12,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // Hair

    ctx.fillStyle =
        customization.hair;

    ctx.beginPath();

    ctx.arc(
        x + player.w / 2,
        y + 4,
        11,
        Math.PI,
        Math.PI * 2
    );

    ctx.fill();


    // Cap

    if (
        customization.accessory ===
        "cap"
    ) {

        ctx.fillStyle =
            "#222";

        ctx.fillRect(
            x + 5,
            y,
            23,
            5
        );

        ctx.fillRect(
            x + 18,
            y + 4,
            12,
            3
        );
    }


    // Glasses

    if (
        customization.accessory ===
        "glasses"
    ) {

        ctx.strokeStyle =
            "#111";

        ctx.lineWidth = 2;

        ctx.strokeRect(
            x + 7,
            y + 5,
            8,
            6
        );

        ctx.strokeRect(
            x + 19,
            y + 5,
            8,
            6
        );

        ctx.beginPath();

        ctx.moveTo(
            x + 15,
            y + 8
        );

        ctx.lineTo(
            x + 19,
            y + 8
        );

        ctx.stroke();
    }
}


// =====================================
// HABITAT BACKGROUNDS
// =====================================

function drawHabitat() {

    const habitat =
        getHabitat();


    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );


    gradient.addColorStop(
        0,
        habitat.sky1
    );

    gradient.addColorStop(
        1,
        habitat.sky2
    );


    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        -50,
        -50,
        W + 100,
        H + 100
    );


    const type =
        habitat.type;


    // -------------------------
    // FOREST
    // -------------------------

    if (
        type === "forest"
    ) {

        drawTrees("#176b3a");

        drawTrees("#27994c");
    }


    // -------------------------
    // DESERT
    // -------------------------

    else if (
        type === "desert"
    ) {

        ctx.fillStyle =
            "rgba(255,230,120,.7)";

        ctx.beginPath();

        ctx.arc(
            W - 120,
            100,
            55,
            0,
            Math.PI * 2
        );

        ctx.fill();

        for (
            let i = 0;
            i < 8;
            i++
        ) {

            drawCactus(
                50 + i * 150,
                H - 155
            );
        }
    }


    // -------------------------
    // OCEAN
    // -------------------------

    else if (
        type === "ocean"
    ) {

        for (
            let i = 0;
            i < 8;
            i++
        ) {

            ctx.strokeStyle =
                "rgba(255,255,255,.5)";

            ctx.lineWidth = 3;

            ctx.beginPath();

            ctx.arc(
                i * 170,
                H - 160,
                40,
                0,
                Math.PI
            );

            ctx.stroke();
        }

        drawClouds();
    }


    // -------------------------
    // SNOW
    // -------------------------

    else if (
        type === "snow"
    ) {

        drawMountain(
            W * .15,
            H - 110,
            280,
            260
        );

        drawMountain(
            W * .65,
            H - 110,
            350,
            320
        );

        drawSnowflakes();
    }


    // -------------------------
    // VOLCANO
    // -------------------------

    else if (
        type === "volcano"
    ) {

        drawVolcano(
            W * .65,
            H - 110
        );

        ctx.fillStyle =
            "rgba(255,180,30,.7)";

        for (
            let i = 0;
            i < 8;
            i++
        ) {

            ctx.beginPath();

            ctx.arc(
                60 + i * 150,
                100 + (i % 3) * 50,
                4,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }
    }


    // -------------------------
    // JUNGLE
    // -------------------------

    else if (
        type === "jungle"
    ) {

        drawTrees("#086b42");

        for (
            let i = 0;
            i < 10;
            i++
        ) {

            ctx.fillStyle =
                "#4de34d";

            ctx.beginPath();

            ctx.ellipse(
                i * 130,
                H - 140,
                40,
                16,
                -0.4,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }
    }


    // -------------------------
    // SPACE
    // -------------------------

    else if (
        type === "space"
    ) {

        drawStars();

        ctx.fillStyle =
            "#ff65ff";

        ctx.beginPath();

        ctx.arc(
            W - 130,
            110,
            50,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.fillStyle =
            "rgba(255,255,255,.7)";

        ctx.beginPath();

        ctx.arc(
            130,
            130,
            35,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    // -------------------------
    // CITY
    // -------------------------

    else if (
        type === "city"
    ) {

        drawCity();

        drawNeonLines();
    }


    // -------------------------
    // CHERRY
    // -------------------------

    else if (
        type === "cherry"
    ) {

        for (
            let i = 0;
            i < 8;
            i++
        ) {

            drawCherryTree(
                40 + i * 150,
                H - 120
            );
        }
    }


    // -------------------------
    // CLOUD
    // -------------------------

    else if (
        type === "cloud"
    ) {

        drawClouds();

        drawClouds();
    }
}


// =====================================
// BACKGROUND HELPERS
// =====================================

function drawTrees(color) {

    ctx.fillStyle =
        color;

    for (
        let i = 0;
        i < 8;
        i++
    ) {

        const x =
            i * 160 + 20;

        const h =
            100 + (i % 3) * 40;

        ctx.fillRect(
            x,
            H - 110 - h,
            25,
            h
        );

        ctx.beginPath();

        ctx.arc(
            x + 12,
            H - 110 - h,
            55,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}


function drawCactus(x,y) {

    ctx.fillStyle =
        "#2e9d45";

    ctx.fillRect(
        x,
        y - 65,
        18,
        65
    );

    ctx.fillRect(
        x - 18,
        y - 48,
        18,
        12
    );

    ctx.fillRect(
        x - 18,
        y - 60,
        10,
        24
    );

    ctx.fillRect(
        x + 18,
        y - 35,
        18,
        12
    );

    ctx.fillRect(
        x + 26,
        y - 47,
        10,
        24
    );
}


function drawClouds() {

    ctx.fillStyle =
        "rgba(255,255,255,.75)";

    for (
        let i = 0;
        i < 6;
        i++
    ) {

        const x =
            70 + i * 190;

        const y =
            100 + (i % 2) * 80;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            28,
            0,
            Math.PI * 2
        );

        ctx.arc(
            x + 35,
            y - 12,
            35,
            0,
            Math.PI * 2
        );

        ctx.arc(
            x + 75,
            y,
            27,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}


function drawMountain(
    x,
    ground,
    width,
    height
) {

    ctx.fillStyle =
        "#53789c";

    ctx.beginPath();

    ctx.moveTo(
        x - width / 2,
        ground
    );

    ctx.lineTo(
        x,
        ground - height
    );

    ctx.lineTo(
        x + width / 2,
        ground
    );

    ctx.closePath();

    ctx.fill();

    ctx.fillStyle =
        "#f5ffff";

    ctx.beginPath();

    ctx.moveTo(
        x,
        ground - height
    );

    ctx.lineTo(
        x - 55,
        ground - height + 70
    );

    ctx.lineTo(
        x + 55,
        ground - height + 70
    );

    ctx.closePath();

    ctx.fill();
}


function drawSnowflakes() {

    ctx.fillStyle =
        "rgba(255,255,255,.8)";

    for (
        let i = 0;
        i < 50;
        i++
    ) {

        const x =
            (i * 137) % W;

        const y =
            (i * 83) % (H - 130);

        ctx.fillRect(
            x,
            y,
            4,
            4
        );
    }
}


function drawVolcano(x,ground) {

    ctx.fillStyle =
        "#542323";

    ctx.beginPath();

    ctx.moveTo(
        x - 220,
        ground
    );

    ctx.lineTo(
        x - 60,
        ground - 220
    );

    ctx.lineTo(
        x + 70,
        ground
    );

    ctx.closePath();

    ctx.fill();

    ctx.fillStyle =
        "#ff5a16";

    ctx.beginPath();

    ctx.arc(
        x - 5,
        ground - 190,
        28,
        0,
        Math.PI * 2
    );

    ctx.fill();
}


function drawStars() {

    ctx.fillStyle =
        "rgba(255,255,255,.9)";

    for (
        let i = 0;
        i < 100;
        i++
    ) {

        const x =
            (i * 137) % W;

        const y =

        ctx.fillRect(

            2,

        );

}


function drawCity() {

    for (

        i < 12;
        i++
    ) {

            i * 100;

        const height =

            (i % 5) * 45;

            ctx.fillRect(

                8

function drawNeonLines() {

    ctx.strokeStyle =
        "#ff35df";

    ctx.lineWidth = 3;

    for (
        let i = 0;
        i < 6;
        i++
    ) {

        ctx.beginPath();

        ctx.moveTo(
            0,
            H - 130 -

        );

            H - 130 -

        );

        ctx.stroke();

function drawCherryTree(x,ground) {

    );

    ctx.fillStyle =

            x - 30 + i * 18,

// =====================================
// COLLISION
// =====================================

function missileHitsPlayer(m) {

    if (
        player.invincible > 0
    ) return false;


    const px =
        player.x;

    const py =
        player.y;

    const pw =
        player.w;

    const ph =
        player.ducking
            ? 34
            : player.h;


    // Being above a missile is safe

    if (
        py + ph <
        m.y + 5
    ) {

        return false;
    }


    return (

        px <
        m.x + m.w &&

        px + pw >
        m.x &&

        py <
        m.y + m.h &&

        py + ph >
        m.y
    );
}


// =====================================
// HIT PLAYER
// =====================================

function hitPlayer() {

    if (
        player.invincible > 0
    ) return;

    lives--;

    player.invincible =
        1.2;

    shake = 18;

    hitFlash = .25;

    sound("hit");


    for (
        let i = 0;
        i < 20;
        i++
    ) {

        particles.push({

            x:
                player.x +
                player.w / 2,

            y:
                player.y +
                player.h / 2,

            vx:
                (Math.random() - .5) *
                350,

            vy:
                (Math.random() - .5) *
                350,

            life: .5,

            maxLife: .5,

            size:
                Math.random() * 5 + 2
        });
    }


    updateHUD();


    if (
        lives <= 0
    ) {

        gameOver();
    }
}


// =====================================
// PAUSE
// =====================================

function togglePause() {

    if (
        !running
    ) return;

    paused =
        !paused;

    document.getElementById(
        "pauseBtn"
    ).textContent =
        paused
            ? "RESUME"
            : "PAUSE";

    if (
        !paused
    ) {

        lastTime =
            performance.now();
    }
}


// =====================================
// START GAME
// =====================================

function startGame() {

    initAudio();

    saveCustomization();

    running = true;

    paused = false;

    score = 0;

    level = 1;

    lives = 3;

    missiles = [];

    particles = [];

    powerups = [];

    coinsList = [];

    missileTimer = 1;

    powerupTimer = 7;

    coinTimer = 2;

    shake = 0;

    hitFlash = 0;


    player.x = 100;

    player.y =
        H - 110;

    player.velocity = 0;

    player.jumping = false;

    player.jumpCount = 0;

    player.ducking = false;

    player.invincible = 0;


    document.getElementById(
        "menu"
    ).classList.add(
        "hidden"
    );

    updateHUD();

    updateCoinHUD();

    document.getElementById(
        "pauseBtn"
    ).textContent =
        "PAUSE";

    sound("start");

    lastTime =
        performance.now();
}


// =====================================
// GAME OVER
// =====================================

function gameOver() {

    running = false;

    setTimeout(
        () => {

            document.getElementById(
                "menu"
            ).classList.remove(
                "hidden"
            );

            document.getElementById(
                "menuMessage"
            ).textContent =
                "Game Over! Score: " +
                score +
                " • Coins: " +
                coins;

        },
        500
    );
}


// =====================================
// UPDATE
// =====================================

function update(dt) {

    if (
        !running ||
        paused
    ) return;


    // PLAYER PHYSICS

    player.velocity +=
        player.gravity * dt;

    player.y +=
        player.velocity * dt;


    const groundY =
        H - 110;


    if (
        player.y >= groundY
    ) {

        player.y =
            groundY;

        player.velocity = 0;

        player.jumping = false;

        // Reset double jump

        player.jumpCount = 0;
    }


    if (
        player.invincible > 0
    ) {

        player.invincible -= dt;
    }


    // MISSILE SPAWNING

    missileTimer -= dt;


    if (
        missileTimer <= 0
    ) {

        spawnMissile();

        missileTimer =
            Math.max(
                .35,
                1.15 -
                level * .035
            );
    }


    // MISSILES

    for (
        let i = missiles.length - 1;
        i >= 0;
        i--
    ) {

        const m =
            missiles[i];

        m.x -=
            m.speed * dt;


        if (
            missileHitsPlayer(m)
        ) {

            hitPlayer();
        }


        if (
            m.x + m.w < 0
        ) {

            missiles.splice(
                i,
                1
            );


            score++;


            const oldLevel =
                level;


            level =
                Math.floor(
                    score / 10
                ) + 1;


            sound("score");


            // LEVEL CHANGED

            if (
                level !== oldLevel
            ) {

                shake = 8;
            }


            updateHUD();
        }
    }


    // COINS

    coinTimer -= dt;


    if (
        coinTimer <= 0
    ) {

        spawnCoin();

        coinTimer =
            1.8 +
            Math.random() * 2.5;
    }


    const magnetOwned =
        purchasedItems.magnet;


    for (
        let i = coinsList.length - 1;
        i >= 0;
        i--
    ) {

        const c =
            coinsList[i];


        c.x -=
            c.speed * dt;


        // Magnet

        if (
            magnetOwned
        ) {

            const dx =
                player.x +
                player.w / 2 -
                (c.x + c.w / 2);

            const dy =
                player.y +
                player.h / 2 -
                (c.y + c.h / 2);

            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (
                distance < 180
            ) {

                c.x +=
                    dx * dt * 4;

                c.y +=
                    dy * dt * 4;
            }
        }


        if (

            player.x <
            c.x + c.w &&

            player.x +
            player.w >
            c.x &&

            player.y <
            c.y + c.h &&

            player.y +
            player.h >
            c.y

        ) {

            collectCoin(i);

            continue;
        }


        if (
            c.x + c.w < 0
        ) {

            coinsList.splice(
                i,
                1
            );
        }
    }


    // LIVES

    powerupTimer -= dt;


    if (
        powerupTimer <= 0 &&
        lives < MAX_LIVES
    ) {

        spawnLife();

        powerupTimer =
            12 +
            Math.random() * 8;
    }


    for (
        let i = powerups.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            powerups[i];

        p.x -=
            p.speed * dt;


        if (

            player.x <
            p.x + p.w &&

            player.x +
            player.w >
            p.x &&

            player.y <
            p.y + p.h &&

            player.y +
            player.h >
            p.y

        ) {

            lives =
                Math.min(
                    MAX_LIVES,
                    lives + 1
                );

            sound("life");

            updateHUD();

            powerups.splice(
                i,
                1
            );

            continue;
        }


        if (
            p.x + p.w < 0
        ) {

            powerups.splice(
                i,
                1
            );
        }
    }


    // PARTICLES

    for (
        let i = particles.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            particles[i];

        p.x +=
            p.vx * dt;

        p.y +=
            p.vy * dt;

        p.vy +=
            700 * dt;

        p.life -= dt;


        if (
            p.life <= 0
        ) {

            particles.splice(
                i,
                1
            );
        }
    }


    shake *=
        Math.pow(
            .001,
            dt
        );


    if (
        shake < .1
    ) {

        shake = 0;
    }


    hitFlash -= dt;


    if (
        hitFlash < 0
    ) {

        hitFlash = 0;
    }
}


// =====================================
// DRAW
// =====================================

function draw() {

    ctx.save();


    // Screen shake

    if (
        shake > 0
    ) {

        ctx.translate(

            (Math.random() - .5) *
            shake,

            (Math.random() - .5) *
            shake
        );
    }


    // COLORFUL HABITAT

    drawHabitat();


    // Ground

    const habitat =
        getHabitat();

    const groundY =
        H - 110;


    ctx.fillStyle =
        habitat.ground;

    ctx.fillRect(
        -50,
        groundY,
        W + 100,
        H - groundY + 50
    );


    ctx.fillStyle =
        habitat.groundTop;

    ctx.fillRect(
        -50,
        groundY,
        W + 100,
        7
    );


    // Decorative ground dots

    ctx.fillStyle =
        habitat.accent;

    for (
        let i = 0;
        i < 25;
        i++
    ) {

        ctx.beginPath();

        ctx.arc(
            (i * 137) % W,
            groundY + 25 +
            (i % 4) * 22,
            4,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    // Missiles

    for (
        const m of missiles
    ) {

        drawMissile(m);
    }


    // Coins

    for (
        const c of coinsList
    ) {

        drawCoin(c);
    }


    // Lives

    for (
        const p of powerups
    ) {

        drawLife(p);
    }


    // Player

    if (
        player.invincible <= 0 ||
        Math.floor(
            player.invincible * 12
        ) % 2 === 0
    ) {

        drawPlayer();
    }


    // Particles

    for (
        const p of particles
    ) {

        ctx.globalAlpha =
            Math.max(
                0,
                p.life /
                p.maxLife
            );

        ctx.fillStyle =
            "#ffe033";

        ctx.fillRect(
            p.x,
            p.y,
            p.size,
            p.size
        );
    }

    ctx.globalAlpha = 1;


    // Hit flash

    if (
        hitFlash > 0
    ) {

        ctx.fillStyle =
            `rgba(255,80,30,${hitFlash * 2})`;

        ctx.fillRect(
            -50,
            -50,
            W + 100,
            H + 100
        );
    }


    // Pause overlay

    if (
        paused
    ) {

        ctx.fillStyle =
            "rgba(0,0,0,.55)";

        ctx.fillRect(
            -50,
            -50,
            W + 100,
            H + 100
        );

        ctx.fillStyle =
            "white";

        ctx.font =
            "bold 50px Arial";

        ctx.textAlign =
            "center";

        ctx.fillText(
            "PAUSED",
            W / 2,
            H / 2
        );
    }


    ctx.restore();
}


// =====================================
// GAME LOOP
// =====================================

function loop(time) {

    const dt =
        Math.min(
            (time - lastTime) /
            1000,
            .033
        );

    lastTime =
        time;

    update(dt);

    draw();

    requestAnimationFrame(loop);
}


updateCoinHUD();
updateShop();
updateHUD();

requestAnimationFrame(loop);

</script>
