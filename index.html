<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Missile Mayhem</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050b14;
    font-family: Arial, sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
}


/* HUD */

#hud {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;

    display: flex;
    justify-content: space-between;

    z-index: 5;

    color: white;
    font-weight: bold;
    font-size: 17px;

    pointer-events: none;
}

.box {
    padding: 8px 12px;
    border-radius: 10px;

    background: rgba(0,0,0,.55);

    border: 1px solid rgba(255,255,255,.2);

    text-shadow: 0 2px 3px black;
}


/* MENU */

#menuScreen {
    position: absolute;
    inset: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    background: rgba(0,0,0,.68);

    z-index: 20;
}

#menu {
    width: min(90%, 440px);

    padding: 30px;

    text-align: center;

    color: white;

    background: #081421;

    border: 2px solid #38d9ff;

    border-radius: 20px;

    box-shadow: 0 0 30px rgba(56,217,255,.3);
}

#menu h1 {
    margin: 0 0 10px;

    font-size: clamp(34px, 8vw, 58px);

    color: #38d9ff;

    text-shadow:
        0 0 10px #38d9ff,
        0 0 25px rgba(56,217,255,.5);
}

#menu p {
    line-height: 1.5;
}

#start {
    margin-top: 15px;

    padding: 14px 32px;

    border: none;
    border-radius: 12px;

    background: #38d9ff;

    color: #06101a;

    font-size: 19px;
    font-weight: bold;

    cursor: pointer;
}

#start:active {
    transform: scale(.95);
}


/* MOBILE CONTROLS */

#controls {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 12px;

    display: flex;
    justify-content: center;

    gap: 20px;

    z-index: 10;
}

.control {
    width: 115px;
    height: 78px;

    border-radius: 18px;

    border: 2px solid rgba(255,255,255,.35);

    background: rgba(0,0,0,.6);

    color: white;

    font-size: 36px;
    font-weight: bold;

    touch-action: none;
    user-select: none;
}

.control small {
    display: block;
    font-size: 12px;
}

.control:active {
    background: rgba(56,217,255,.55);
    transform: scale(.94);
}


/* Hide mobile controls on desktop */

@media (min-width: 800px) {
    #controls {
        display: none;
    }
}

@media (max-width: 500px) {

    #hud {
        font-size: 13px;
        top: 7px;
        left: 7px;
        right: 7px;
    }

    .box {
        padding: 6px 8px;
    }

    .control {
        width: 105px;
        height: 70px;
    }
}
</style>
</head>


<body>

<div id="game">

    <canvas id="canvas"></canvas>


    <!-- HUD -->

    <div id="hud">

        <div class="box">
            SCORE:
            <span id="score">0</span>
        </div>

        <div class="box">
            LIVES:
            <span id="lives">❤️❤️❤️</span>
        </div>

        <div class="box">
            LEVEL:
            <span id="level">1</span>
        </div>

    </div>


    <!-- MENU -->

    <div id="menuScreen">

        <div id="menu">

            <h1 id="title">
                MISSILE MAYHEM
            </h1>

            <p id="message">
                Jump and duck to survive!
            </p>

            <p>
                🚀 Low missile = <b>JUMP</b><br>
                🚀 High missile = <b>DUCK</b>
            </p>

            <p>
                Computer: ↑ Jump &nbsp; ↓ Duck<br>
                Mobile: Use the buttons
            </p>

            <button id="start">
                START GAME
            </button>

        </div>

    </div>


    <!-- MOBILE BUTTONS -->

    <div id="controls">

        <button
            id="jump"
            class="control">

            ↑
            <small>JUMP</small>

        </button>


        <button
            id="duck"
            class="control">

            ↓
            <small>DUCK</small>

        </button>

    </div>

</div>


<script>

/* =========================================================
   MISSILE MAYHEM
   SIMPLE 2D VERSION
   ========================================================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


/* =========================================================
   ELEMENTS
   ========================================================= */

const scoreElement =
    document.getElementById("score");

const livesElement =
    document.getElementById("lives");

const levelElement =
    document.getElementById("level");

const menuScreen =
    document.getElementById("menuScreen");

const titleElement =
    document.getElementById("title");

const messageElement =
    document.getElementById("message");

const startButton =
    document.getElementById("start");

const jumpButton =
    document.getElementById("jump");

const duckButton =
    document.getElementById("duck");


/* =========================================================
   CANVAS SIZE
   ========================================================= */

let W = 0;
let H = 0;
let ground = 0;


function resize() {

    W = window.innerWidth;
    H = window.innerHeight;

    const dpr =
        Math.min(window.devicePixelRatio || 1, 2);

    canvas.width =
        W * dpr;

    canvas.height =
        H * dpr;

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    ground =
        H * 0.78;

    if (!running) {
        player.y =
            ground - player.h;
    }
}

window.addEventListener("resize", resize);


/* =========================================================
   GAME VARIABLES
   ========================================================= */

let running = false;

let score = 0;

let lives = 3;

let level = 1;

let lastTime = 0;

let spawnTimer = 0;

let screenShake = 0;

let redFlash = 0;

let missiles = [];

let particles = [];


/* =========================================================
   PLAYER
   ========================================================= */

const player = {

    x: 100,

    y: 0,

    w: 44,

    h: 72,

    velocity: 0,

    jumpPower: 760,

    gravity: 1900,

    jumping: false,

    ducking: false,

    invincible: 0
};


/* =========================================================
   RESET PLAYER
   ========================================================= */

function resetPlayer() {

    player.x =
        Math.min(110, W * .18);

    player.y =
        ground - player.h;

    player.velocity = 0;

    player.jumping = false;

    player.ducking = false;

    player.invincible = 0;
}


/* =========================================================
   START
   ========================================================= */

function startGame() {

    running = true;

    score = 0;

    lives = 3;

    level = 1;

    spawnTimer = 0;

    screenShake = 0;

    redFlash = 0;

    missiles = [];

    particles = [];

    resetPlayer();

    updateHUD();

    menuScreen.style.display =
        "none";

    lastTime =
        performance.now();

    requestAnimationFrame(loop);
}


/* =========================================================
   GAME OVER
   ========================================================= */

function gameOver() {

    running = false;

    player.ducking = false;

    titleElement.textContent =
        "GAME OVER";

    messageElement.innerHTML =
        "Final score: <b>" +
        score +
        "</b>";

    startButton.textContent =
        "PLAY AGAIN";

    menuScreen.style.display =
        "flex";
}


/* =========================================================
   HUD
   ========================================================= */

function updateHUD() {

    scoreElement.textContent =
        score;

    levelElement.textContent =
        level;

    let hearts = "";

    for (
        let i = 0;
        i < lives;
        i++
    ) {
        hearts += "❤️";
    }

    if (lives <= 0) {
        hearts = "💀";
    }

    livesElement.textContent =
        hearts;
}


/* =========================================================
   JUMP
   ========================================================= */

function jump() {

    if (!running) {
        return;
    }

    /*
       IMPORTANT:
       The player can jump whenever
       they are not already in the air.
    */

    if (!player.jumping) {

        player.ducking = false;

        player.jumping = true;

        player.velocity =
            -player.jumpPower;
    }
}


/* =========================================================
   DUCK
   ========================================================= */

function startDuck() {

    if (!running) {
        return;
    }

    /*
       Ducking is for standing
       underneath high missiles.
    */

    if (!player.jumping) {

        player.ducking = true;
    }
}


function stopDuck() {

    player.ducking = false;
}


/* =========================================================
   KEYBOARD
   ========================================================= */

window.addEventListener(
    "keydown",
    function(e) {

        if (
            e.code === "ArrowUp" ||
            e.code === "Space"
        ) {

            e.preventDefault();

            if (!e.repeat) {
                jump();
            }
        }


        if (
            e.code === "ArrowDown"
        ) {

            e.preventDefault();

            startDuck();
        }

    }
);


window.addEventListener(
    "keyup",
    function(e) {

        if (
            e.code === "ArrowDown"
        ) {

            stopDuck();
        }

    }
);


/* =========================================================
   MOBILE JUMP
   ========================================================= */

jumpButton.addEventListener(
    "pointerdown",
    function(e) {

        e.preventDefault();

        jump();

    }
);


/* =========================================================
   MOBILE DUCK
   ========================================================= */

duckButton.addEventListener(
    "pointerdown",
    function(e) {

        e.preventDefault();

        startDuck();

    }
);


duckButton.addEventListener(
    "pointerup",
    function(e) {

        e.preventDefault();

        stopDuck();

    }
);


duckButton.addEventListener(
    "pointercancel",
    stopDuck
);


duckButton.addEventListener(
    "pointerleave",
    stopDuck
);


/* =========================================================
   MISSILE CREATION
   ========================================================= */

function createMissile() {

    /*
       50% chance of each type.
    */

    const high =
        Math.random() < .5;


    missiles.push({

        x:
            W + 80,

        y:
            high
                ? ground - 72
                : ground - 45,

        w:
            70,

        h:
            24,

        speed:
            430 + level * 35,

        high:
            high,

        hit:
            false
    });
}


/* =========================================================
   PLAYER HITBOX
   ========================================================= */

function playerBox() {

    if (player.ducking) {

        return {

            left:
                player.x + 6,

            right:
                player.x + player.w - 6,

            top:
                ground - 38,

            bottom:
                ground

        };

    }


    return {

        left:
            player.x + 6,

        right:
            player.x + player.w - 6,

        top:
            player.y,

        bottom:
            player.y + player.h

    };
}


/* =========================================================
   COLLISION
   ========================================================= */

function collision(missile) {

    const p =
        playerBox();


    return (

        p.left <
        missile.x +
        missile.w &&

        p.right >
        missile.x &&

        p.top <
        missile.y +
        missile.h &&

        p.bottom >
        missile.y

    );
}


/* =========================================================
   EXPLOSION
========================================================= */

function explosion(x, y) {

    for (
        let i = 0;
        i < 45;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI *
            2;

        const speed =
            80 +
            Math.random() *
            420;

        particles.push({

            x: x,

            y: y,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            size:
                2 +
                Math.random() * 7,

            life:
                .5 +
                Math.random() *
                .7

        });
    }
}


/* =========================================================
   HIT PLAYER
   ========================================================= */

function hitPlayer(missile) {

    if (player.invincible > 0) {
        return;
    }

    player.invincible =
        1.2;

    lives--;

    missile.hit = true;

    explosion(

        player.x +
        player.w / 2,

        player.y +
        player.h / 2

    );

    screenShake = 20;

    redFlash = .4;

    updateHUD();

    if (lives <= 0) {

        setTimeout(
            gameOver,
            450
        );
    }
}


/* =========================================================
   UPDATE PLAYER
   ========================================================= */

function updatePlayer(dt) {

    /*
       If jumping, apply gravity.
    */

    if (player.jumping) {

        player.velocity +=
            player.gravity * dt;

        player.y +=
            player.velocity * dt;


        /*
           Player reaches ground.
        */

        if (
            player.y >=
            ground - player.h
        ) {

            player.y =
                ground - player.h;

            player.velocity = 0;

            player.jumping = false;
        }
    }


    if (player.invincible > 0) {

        player.invincible -= dt;

    }
}


/* =========================================================
   UPDATE MISSILES
   ========================================================= */

function updateMissiles(dt) {

    for (
        let i =
            missiles.length - 1;

        i >= 0;

        i--
    ) {

        const m =
            missiles[i];


        m.x -=
            m.speed * dt;


        /*
           Check collision.
        */

        if (
            !m.hit &&
            collision(m)
        ) {

            hitPlayer(m);
        }


        /*
           Missile leaves screen.
        */

        if (
            m.x + m.w <
            -50
        ) {

            if (!m.hit) {

                score++;

                level =
                    Math.floor(
                        score / 10
                    ) + 1;

                updateHUD();
            }

            missiles.splice(
                i,
                1
            );
        }
    }
}


/* =========================================================
   UPDATE PARTICLES
   ========================================================= */

function updateParticles(dt) {

    for (
        let i =
            particles.length - 1;

        i >= 0;

        i--
    ) {

        const p =
            particles[i];


        p.x +=
            p.vx * dt;

        p.y +=
            p.vy * dt;

        p.vy +=
            650 * dt;

        p.vx *=
            .985;

        p.life -=
            dt;


        if (
            p.life <= 0
        ) {

            particles.splice(
                i,
                1
            );
        }
    }
}


/* =========================================================
   DRAW BACKGROUND
   ========================================================= */

function drawBackground() {

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );


    gradient.addColorStop(
        0,
        "#050b18"
    );

    gradient.addColorStop(
        .55,
        "#12395b"
    );

    gradient.addColorStop(
        1,
        "#28454a"
    );


    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
       Stars
    */

    ctx.fillStyle =
        "white";

    for (
        let i = 0;
        i < 90;
        i++
    ) {

        const x =
            (i * 173) % W;

        const y =
            (i * 71) %
            (H * .55);

        ctx.fillRect(
            x,
            y,
            2,
            2
        );
    }


    /*
       Moon
    */

    ctx.fillStyle =
        "#e8f3ff";

    ctx.beginPath();

    ctx.arc(
        W - 100,
        95,
        45,
        0,
        Math.PI * 2
    );

    ctx.fill();
}


/* =========================================================
   DRAW GROUND
   ========================================================= */

function drawGround() {

    ctx.fillStyle =
        "#15292e";

    ctx.fillRect(
        0,
        ground,
        W,
        H - ground
    );


    /*
       Neon ground line
    */

    ctx.fillStyle =
        "#38d9ff";

    ctx.fillRect(
        0,
        ground,
        W,
        4
    );


    /*
       Moving road marks
    */

    const offset =
        (
            performance.now() / 5
        ) % 100;


    ctx.fillStyle =
        "rgba(255,255,255,.15)";


    for (
        let x = -100 + offset;
        x < W;
        x += 100
    ) {

        ctx.fillRect(
            x,
            ground + 48,
            50,
            4
        );
    }
}


/* =========================================================
   DRAW PLAYER
   ========================================================= */

function drawPlayer() {

    /*
       THIS IS THE IMPORTANT JUMP FIX.

       When jumping, player.y is used.

       When ducking, the player becomes
       shorter but stays on the ground.
    */

    const h =
        player.ducking
            ? 40
            : player.h;


    const y =
        player.ducking
            ? ground - h
            : player.y;


    /*
       Hit flash
    */

    if (
        player.invincible > 0 &&
        Math.floor(
            player.invincible * 12
        ) % 2 === 0
    ) {

        return;
    }


    /*
       Shadow
    */

    ctx.fillStyle =
        "rgba(0,0,0,.35)";

    ctx.beginPath();

    ctx.ellipse(
        player.x + 22,
        ground + 5,
        28,
        7,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
       Body
    */

    ctx.fillStyle =
        "#38d9ff";

    ctx.fillRect(
        player.x + 8,
        y + 18,
        28,
        h - 18
    );


    /*
       Head
    */

    ctx.fillStyle =
        "#f1c27d";

    ctx.beginPath();

    ctx.arc(
        player.x + 22,
        y + 12,
        12,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
       Helmet
    */

    ctx.fillStyle =
        "#dce8f2";

    ctx.beginPath();

    ctx.arc(
        player.x + 22,
        y + 9,
        13,
        Math.PI,
        Math.PI * 2
    );

    ctx.fill();


    /*
       Visor
    */

    ctx.fillStyle =
        "#14283d";

    ctx.fillRect(
        player.x + 22,
        y + 8,
        10,
        6
    );


    /*
       Legs
    */

    if (!player.ducking) {

        ctx.fillStyle =
            "#197aa7";

        ctx.fillRect(
            player.x + 8,
            y + h - 17,
            9,
            17
        );

        ctx.fillRect(
            player.x + 27,
            y + h - 17,
            9,
            17
        );
    }
}


/* =========================================================
   DRAW MISSILE
   ========================================================= */

function drawMissile(m) {

    if (m.hit) {
        return;
    }


    /*
       Flame
    */

    ctx.fillStyle =
        "#ff9d00";

    ctx.beginPath();

    ctx.moveTo(
        m.x + m.w,
        m.y + m.h / 2
    );

    ctx.lineTo(
        m.x + m.w + 28,
        m.y + 3
    );

    ctx.lineTo(
        m.x + m.w + 28,
        m.y + m.h - 3
    );

    ctx.closePath();

    ctx.fill();


    /*
       Inner flame
    */

    ctx.fillStyle =
        "#fff000";

    ctx.beginPath();

    ctx.moveTo(
        m.x + m.w,
        m.y + m.h / 2
    );

    ctx.lineTo(
        m.x + m.w + 17,
        m.y + 8
    );

    ctx.lineTo(
        m.x + m.w + 17,
        m.y + m.h - 8
    );

    ctx.closePath();

    ctx.fill();


    /*
       Missile body
    */

    ctx.fillStyle =
        "#e7edf2";

    ctx.beginPath();

    ctx.roundRect(
        m.x,
        m.y,
        m.w,
        m.h,
        10
    );

    ctx.fill();


    /*
       Nose
    */

    ctx.fillStyle =
        "#e83b4f";

    ctx.beginPath();

    ctx.moveTo(
        m.x,
        m.y
    );

    ctx.lineTo(
        m.x - 16,
        m.y + m.h / 2
    );

    ctx.lineTo(
        m.x,
        m.y + m.h
    );

    ctx.closePath();

    ctx.fill();


    /*
       Window
    */

    ctx.fillStyle =
        "#182636";

    ctx.beginPath();

    ctx.arc(
        m.x + 22,
        m.y + 12,
        5,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
       Stripe
    */

    ctx.fillStyle =
        "#e83b4f";

    ctx.fillRect(
        m.x + 43,
        m.y,
        7,
        m.h
    );
}


/* =========================================================
   DRAW PARTICLES
   ========================================================= */

function drawParticles() {

    for (
        const p of particles
    ) {

        ctx.globalAlpha =
            Math.max(
                0,
                p.life
            );

        ctx.fillStyle =
            p.life > .5
                ? "#ffd000"
                : "#ff4b20";


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.globalAlpha = 1;
}


/* =========================================================
   DRAW
   ========================================================= */

function draw() {

    ctx.save();


    /*
       Screen shake
    */

    if (
        screenShake > 0
    ) {

        ctx.translate(
            (Math.random() - .5) *
            screenShake,

            (Math.random() - .5) *
            screenShake
        );
    }


    drawBackground();

    drawGround();


    for (
        const m of missiles
    ) {

        drawMissile(m);
    }


    drawPlayer();

    drawParticles();


    ctx.restore();


    /*
       Red hit flash
    */

    if (
        redFlash > 0
    ) {

        ctx.fillStyle =
            "rgba(255,0,0," +
            redFlash +
            ")";

        ctx.fillRect(
            0,
            0,
            W,
            H
        );

        redFlash -=
            .025;
    }


    /*
       Shake decay
    */

    if (
        screenShake > 0
    ) {

        screenShake *= .9;

        if (
            screenShake < .5
        ) {

            screenShake = 0;
        }
    }
}


/* =========================================================
   GAME LOOP
   ========================================================= */

function loop(time) {

    if (!running) {

        draw();

        return;
    }


    let dt =
        (time - lastTime) /
        1000;


    lastTime =
        time;


    /*
       Don't let lag make the player
       teleport through the game.
    */

    dt =
        Math.min(
            dt,
            .033
        );


    /*
       Missile spawning
    */

    spawnTimer +=
        dt;


    const spawnDelay =
        Math.max(
            .48,
            1.25 -
            level * .06
        );


    if (
        spawnTimer >=
        spawnDelay
    ) {

        spawnTimer = 0;

        createMissile();
    }


    updatePlayer(dt);

    updateMissiles(dt);

    updateParticles(dt);

    draw();


    requestAnimationFrame(
        loop
    );
}


/* =========================================================
   START BUTTON
   ========================================================= */

startButton.addEventListener(
    "click",
    function() {

        titleElement.textContent =
            "MISSILE MAYHEM";

        messageElement.textContent =
            "Jump and duck to survive!";

        startGame();

    }
);


/* =========================================================
   INITIALIZE
   ========================================================= */

resize();

resetPlayer();

draw();

</script>

</body>
</html>
